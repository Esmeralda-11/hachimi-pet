            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="12" rx="2" />
              <path d="M8 20h8M12 16v4" />
            </svg>
          </button>
        </div>

        <button type="button" id="btnToggleHidePet" class="icon-btn-outline" title="隐藏桌宠" aria-label="隐藏桌宠">
          <svg id="iconEyeOpen" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg id="iconEyeClosed" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" y1="2" x2="22" y2="22" />
          </svg>
        </button>

        <button type="button" id="btnReload" class="icon-btn-outline" title="重新加载" aria-label="重新加载">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15.36-6.36L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-15.36 6.36L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="packsSection" class="section" data-section-key="packs">
      <div class="sec-head">
        <button type="button" class="sec-collapse-btn" data-sec-toggle="packs" aria-expanded="true">
          <svg class="chevron-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
          </svg>
          <h2 class="sec-title">形象</h2>
        </button>
        <div class="sec-head-actions">
          <button type="button" id="btnPacksExpandAll" class="link-btn">全部展开</button>
          <span class="sec-action-sep" aria-hidden="true">/</span>
          <button type="button" id="btnPacksCollapseAll" class="link-btn">全部折叠</button>
        </div>
      </div>
      <div class="sec-body">
        <div id="packsNotice" class="packs-notice hidden" role="status" aria-live="polite"></div>
        <div id="packsGrid" class="packs-stack"></div>
      </div>
    </section>

    <section id="settingsSection" class="section" data-section-key="settings">
      <div class="sec-head">
        <button type="button" class="sec-collapse-btn" data-sec-toggle="settings" aria-expanded="true">
          <svg class="chevron-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
          </svg>

    const $ = (id) => document.getElementById(id);

    function humanizeError(input) {
      const status = Number(input?.status || input?.statusCode || 0);
      const raw = String(input?.message || input?.error || input || '').trim();
      const lower = raw.toLowerCase();

      if (status === 413 || /payload too large|entity too large|too large/i.test(raw)) {
        return '上传的图片合计体积过大，请减少图片数量或换小一点的图片后再试。';
      }
      if (/failed to fetch|networkerror|load failed|network request failed|econnrefused|econnreset|socket hang up|epipe/i.test(lower)) {
        return '当前连不上桌宠服务，请确认桌宠正在运行后重试。';
      }
      if (status === 429 || /rate limit|quota|too many requests/i.test(lower)) {
        return '当前生成请求较多或模型额度紧张，请稍等片刻后再试。';
      }
      if (status === 404 || /\bnot found\b/i.test(lower)) {
        return '找不到对应的角色或文件，请刷新列表后再试。';
      }
      if (/maxitems|invalid arguments|schema/i.test(lower)) {
        return '参考图提交格式暂不匹配，请减少图片数量或稍后再试。';
      }
      if (status >= 500 || /internal server error|bad gateway|service unavailable/i.test(lower)) {
        return '服务暂时没处理过来，请稍等一下再试。';
      }
      if (/aborterror|timeout|timed out/i.test(lower)) {
        return '图片处理超时了，建议减少单次数量或换小一点的图片再试。';
      }
      if (/heic|heif|avif|svg|tiff|unsupported|corrupt|cannot identify|decode|读取图片失败/i.test(lower)) {
        return '这张图片格式暂不支持或文件已损坏，请改用 PNG、JPG、WebP 或动图 GIF。';
      }
      if (/blank|transparent|empty|no subject|找不到|全透明|纯白/i.test(lower)) {
        return '没有在图片里找到清楚的角色主体，请换一张背景干净、主体完整的图片。';
      }
      if (/missing image|no input/i.test(lower)) {
        return '请先上传至少一张角色图片，再开始生成。';
      }
      if (status === 400 && /syntaxerror|unexpected token|json/i.test(lower)) {
        return '提交的数据格式有误，请刷新页面后再试。';
      }

      const hasTechLeak = /(?:traceback|command failed|\b(?:error|exception|syntaxerror|typeerror|referenceerror|rangeerror|enoent|einval|econnrefused|etimedout|epipe)\b|\/users\/|\/volumes\/|\/var\/|\/tmp\/|[a-z]:\\|127\.0\.0\.1|localhost:\d+|node_modules|\.(?:py|cjs|mjs|js)\b|\bat\s+\S+\s*\(|http\s*\d{3}|status\s*\d{3})/i.test(raw);
      if (raw && !hasTechLeak && /[\u4e00-\u9fff]/.test(raw)) {
        return raw;
      }
      return '操作没有成功，请换一张图片或稍后再试。';
    }

    function createNoticeIcon(kind) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '14');
      svg.setAttribute('height', '14');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      if (kind === 'ok') {
        const p = document.createElementNS(ns, 'polyline');
        p.setAttribute('points', '20 6 9 17 4 12');
        svg.appendChild(p);
      } else {
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', '12');
        c.setAttribute('cy', '12');
        c.setAttribute('r', '9');
        const l1 = document.createElementNS(ns, 'line');
        l1.setAttribute('x1', '12');
        l1.setAttribute('y1', '8');
        l1.setAttribute('x2', '12');
        l1.setAttribute('y2', '12');
        const l2 = document.createElementNS(ns, 'line');
        l2.setAttribute('x1', '12');
        l2.setAttribute('y1', '16');
        l2.setAttribute('x2', '12.01');
        l2.setAttribute('y2', '16');
        svg.appendChild(c);
        svg.appendChild(l1);
        svg.appendChild(l2);
      }
      return svg;
    }

    function showToast(msg, kind = 'ok') {
      const el = $('toast');
      el.innerHTML = '';
      if (!msg) {
        el.className = 'notice-bar hidden';
        return;
      }
      el.className = 'notice-bar ' + (kind === 'err' ? 'is-err' : 'is-ok');
      el.appendChild(createNoticeIcon(kind === 'err' ? 'err' : 'ok'));
      const span = document.createElement('span');
      span.textContent = kind === 'err' ? humanizeError(msg) : msg;
      el.appendChild(span);
    }

    function getDefaultAccentHex() {
      const activePack = state.packs.find((p) => p.id === state.packId) || state.activePack;
      const activeVar = activePack?.variants?.find((v) => v.id === state.scheme);
      if (activeVar?.color && /^#[0-9a-fA-F]{6}$/.test(activeVar.color)) {
        return activeVar.color;
      }
      const pKey = normalizePaletteKey(state.settings.palette);
      return PALETTE_META[pKey].accentLight;
    }

    function syncDefaultColorInput() {
      if (!state.colorManuallyPicked && !state.suggestedColorApplied) {
        $('inpColor').value = getDefaultAccentHex();
      }
    }

    function applyTheme(theme) {
      const mode = theme === 'light' || theme === 'dark' ? theme : 'system';
      const meta = document.querySelector('meta[name="color-scheme"]');
      if (mode === 'light' || mode === 'dark') {
        if (meta) meta.setAttribute('content', mode);
        document.documentElement.dataset.theme = mode;
      } else {
        if (meta) meta.setAttribute('content', 'light dark');
        delete document.documentElement.dataset.theme;
      }
      try {
        if (mode === 'system') {
          localStorage.removeItem('hachimi-theme');
        } else {
          localStorage.setItem('hachimi-theme', mode);
        }
      } catch (e) {}

      document.querySelectorAll('[data-theme-mode]').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.themeMode === mode);
      });
    }

    function applyPalette(palette) {
      const key = normalizePaletteKey(palette);
      document.documentElement.dataset.palette = key;
      try {
        localStorage.setItem('hachimi-palette', key);
      } catch (e) {}
      document.querySelectorAll('[data-palette-btn]').forEach((btn) => {
        const active = btn.dataset.paletteBtn === key;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', String(active));
      });
      $('paletteNameLabel').textContent = PALETTE_META[key].name;
      syncDefaultColorInput();
    }

    async function api(path, opts = {}) {
      let res;
      try {
        res = await fetch(path, {
          headers: { 'Content-Type': 'application/json' },
          ...opts,
        });
      } catch (netErr) {
        throw new Error(humanizeError(netErr));
      }
      const text = await res.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = null;
      }
      if (!res.ok) {
        const err = new Error(humanizeError({ status: res.status, message: data?.error || text }));
        err.status = res.status;
        throw err;
      }
      return data || {};
    }

    function syncScalePresetButtons(mainVal, subVal) {
      document.querySelectorAll('[data-main-preset]').forEach((btn) => {
        const pv = Number(btn.dataset.mainPreset);
        btn.classList.toggle('is-active', Math.abs(mainVal - pv) < 0.025);
      });
      document.querySelectorAll('[data-sub-preset]').forEach((btn) => {
        const pv = Number(btn.dataset.subPreset);
        btn.classList.toggle('is-active', Math.abs(subVal - pv) < 0.025);
      });
    }

    function renderSettingsControls() {

      const temp = ['lively', 'daily', 'quiet'].includes(s.temperament) ? s.temperament : 'daily';

      $('iconEyeClosed').classList.toggle('hidden', !hidden);

      const mainVal = Number(s.mainScale ?? s.scale ?? 0.85);
      const subVal = Number(s.subagentScale ?? 0.80);
      $('rngMainScale').value = String(Math.min(1.40, Math.max(0.40, mainVal)));
      $('valMainScale').textContent = Math.round(mainVal * 100) + '%';
      $('rngSubScale').value = String(Math.min(1.30, Math.max(0.40, subVal)));
      $('valSubScale').textContent = Math.round(subVal * 100) + '%';
      syncScalePresetButtons(mainVal, subVal);

      const setPill = (id, on) => {
        const el = $(id);

        el.setAttribute('aria-pressed', String(on));

      setPill('pillSpeech', s.showSpeechBubble !== false);

        btn.classList.toggle('is-active', btn.dataset.trayVisible === String(trayVisible));

    function createMoveIcon(size = 12) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', String(size));
      svg.setAttribute('height', String(size));
      svg.setAttribute('viewBox', '0 0 24 24');

      svg.setAttribute('stroke-width', '2');

    function stopRenamePropagation(el) {
      if (!el) return;
      ['mousedown', 'pointerdown', 'click', 'dblclick', 'dragstart'].forEach((evtName) => {
        el.addEventListener(evtName, (ev) => {
          ev.stopPropagation();
          if (evtName === 'dragstart') {
            ev.preventDefault();
          }
        });
      });
    }

    function isPacksInteractionLocked() {
      if (state.editingPackId || state.editingVariantKey) return true;
      const ae = document.activeElement;
      if (!ae || !(ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable)) {
        return false;
      }
      if (ae.hasAttribute && (ae.hasAttribute('data-rename-pack-input') || ae.hasAttribute('data-rename-var-input'))) {
        return false;
      }
      const pop = $('movePopover');
      if (pop && !pop.classList.contains('hidden') && pop.contains(ae)) return true;
      const grid = $('packsGrid');
      if (grid && grid.contains(ae)) return true;
      return false;
    }

    let activeRenameOutsideCommit = null;

    function clearEditingRenameState() {
      activeRenameOutsideCommit = null;
      state.editingPackId = '';
      state.editingVariantKey = '';
      state.editingOriginalValue = '';
      state.editingDraftValue = '';
      state.imeComposing = false;
    }

    function syncActiveAvatarAndSelectionInPlace() {
      document.querySelectorAll('.variant-item').forEach((el) => {
        el.classList.toggle('is-selected', el.dataset.packId === state.packId && el.dataset.variantId === state.scheme);
      });
      const activePack = state.packs.find((p) => p.id === state.packId) || state.activePack;
      const activeVar = activePack?.variants?.find((v) => v.id === state.scheme);
      const avatar = $('activeAvatar');
      const fallback = $('activeFallback');
      if (avatar && fallback) {
        if (activeVar?.thumbUrl) {
          avatar.src = activeVar.thumbUrl;
          avatar.alt = activeVar.name || activeVar.id;
          avatar.classList.remove('hidden');
          fallback.classList.add('hidden');
        } else {
          avatar.classList.add('hidden');
          fallback.classList.remove('hidden');
        }
      }
    }

    function flushPendingPacksRender() {
      if (!isPacksInteractionLocked()) {
        state.pendingPacksRender = false;
        renderPacks();
      }
    }

    function closeMovePopover() {
      if (!state.moveMenu) return;
      state.moveMenu = null;
      $('movePopover').classList.add('hidden');
      $('movePopover').innerHTML = '';
      document.querySelectorAll('.variant-wrap.has-open-menu').forEach((el) => el.classList.remove('has-open-menu'));
      if (state.pendingPacksRender) {
        flushPendingPacksRender();
      }
    }

    function openMovePopover(pack, variant, anchorBtn) {
      const sameTarget = state.moveMenu && state.moveMenu.sourcePackId === pack.id && state.moveMenu.variantId === variant.id;
      closeMovePopover();
      if (sameTarget) return;

      state.moveMenu = {
        sourcePackId: pack.id,
        variantId: variant.id,
        variantName: variant.name || variant.id,
        showNewInput: false,
      };
      const wrap = anchorBtn.closest('.variant-wrap');
      if (wrap) wrap.classList.add('has-open-menu');

      const pop = $('movePopover');
      renderMovePopoverContents();
      pop.classList.remove('hidden');

      const rect = anchorBtn.getBoundingClientRect();
      const popRect = pop.getBoundingClientRect();
      const left = Math.min(window.innerWidth - popRect.width - 12, Math.max(12, rect.right - popRect.width));
      const preferTop = rect.bottom + popRect.height + 10 > window.innerHeight && rect.top - popRect.height - 10 > 12;
      const top = preferTop ? (rect.top - popRect.height - 6) : (rect.bottom + 6);
      pop.style.left = `${Math.round(left)}px`;
      pop.style.top = `${Math.round(top)}px`;
    }

    function renderMovePopoverContents() {
      const mm = state.moveMenu;
      const pop = $('movePopover');
      if (!mm) return;
      pop.innerHTML = '';

      const head = document.createElement('div');
      head.className = 'move-pop-head';
      head.textContent = `移动「${mm.variantName}」至归属`;
      pop.appendChild(head);

      const list = document.createElement('div');
      list.className = 'move-pop-list';

      const targets = state.packs.filter((p) => !p.isBuiltin && p.id !== mm.sourcePackId);
      if (targets.length === 0) {
        const emptyHint = document.createElement('div');
        emptyHint.style.padding = '5px 8px';
        emptyHint.style.fontSize = '11.5px';
        emptyHint.style.color = 'var(--ink-3)';
        emptyHint.textContent = '暂无其他归属，可在下方新建归属';
        list.appendChild(emptyHint);
      }
      for (const tp of targets) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'move-pop-item';
        const nm = document.createElement('span');
        nm.textContent = tp.name || tp.slotLabel || tp.id;
        nm.style.overflow = 'hidden';
        nm.style.textOverflow = 'ellipsis';
        nm.style.whiteSpace = 'nowrap';
        const cnt = document.createElement('span');
        cnt.className = 'move-pop-count';
        cnt.textContent = `${(tp.variants || []).length} 个`;
        item.appendChild(nm);
        item.appendChild(cnt);
        item.onclick = async () => {
          closeMovePopover();
          await moveVariant({
            sourcePackId: mm.sourcePackId,
            variantId: mm.variantId,
            variantName: mm.variantName,
            targetPackId: tp.id,
            targetPackName: tp.name || tp.id,
          });
        };
        list.appendChild(item);
      }
      pop.appendChild(list);

      const sep = document.createElement('div');
      sep.className = 'move-pop-sep';
      pop.appendChild(sep);

      if (!mm.showNewInput) {
        const newBtn = document.createElement('button');
        newBtn.type = 'button';
        newBtn.className = 'move-pop-item is-accent';
        newBtn.textContent = '+ 移入新归属…';
        newBtn.onclick = (ev) => {
          ev.stopPropagation();
          mm.showNewInput = true;
          renderMovePopoverContents();
        };
        pop.appendChild(newBtn);
      } else {
        const form = document.createElement('form');
        form.className = 'move-pop-new-form';
        stopRenamePropagation(form);
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'input-box';
        inp.style.height = '30px';
        inp.style.fontSize = '12px';
        inp.maxLength = 48;
        inp.placeholder = '输入新归属名称';
        inp.value = '';
        stopRenamePropagation(inp);

        let imeComposing = false;
        inp.addEventListener('compositionstart', () => {
          imeComposing = true;
          state.imeComposing = true;
        });
        inp.addEventListener('compositionend', () => {
          imeComposing = false;
          state.imeComposing = false;
        });
        inp.addEventListener('keydown', (ev) => {
          ev.stopPropagation();
          if (ev.isComposing || imeComposing || ev.keyCode === 229) return;
          if (ev.key === 'Escape') {
            ev.preventDefault();
            closeMovePopover();
          }
        });

        const acts = document.createElement('div');
        acts.className = 'move-pop-new-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'link-btn';
        cancelBtn.textContent = '取消';
        cancelBtn.onclick = (ev) => {
          ev.stopPropagation();
          mm.showNewInput = false;
          renderMovePopoverContents();
        };
        const okBtn = document.createElement('button');
        okBtn.type = 'submit';
        okBtn.className = 'mini-btn is-accent';
        okBtn.style.height = '26px';
        okBtn.textContent = '移入';
        acts.appendChild(cancelBtn);
        acts.appendChild(okBtn);
        form.appendChild(inp);
        form.appendChild(acts);
        form.onsubmit = async (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          if (imeComposing || state.imeComposing) return;
          const newName = inp.value.trim();
          if (!newName) {
            showPacksNotice('请先输入新归属的名称。', 'err');
            inp.focus();
            return;
          }
          if (newName.length > 48) {
            showPacksNotice('归属名称请控制在 48 个字以内。', 'err');
            inp.focus();
            return;
          }
          closeMovePopover();
          await moveVariant({
            sourcePackId: mm.sourcePackId,
            variantId: mm.variantId,
            variantName: mm.variantName,
            targetPackId: '__new__',
            targetPackName: newName,
          });
        };
        pop.appendChild(form);
        requestAnimationFrame(() => inp.focus());
      }
    }

    async function renamePackOrVariant({ packId, variantId = '', name }) {
      const cleanName = String(name || '').trim();
      if (!cleanName) {
        showPacksNotice(variantId ? '方案名称不能为空。' : '归属名称不能为空。', 'err');
        return false;
      }
      if (cleanName.length > 48) {
        showPacksNotice('名称长度请控制在 48 个字以内。', 'err');
        return false;
      }
      try {
        const body = variantId ? { packId, variantId, name: cleanName } : { packId, name: cleanName };
        const data = await api('/api/packs/rename', {
          method: 'POST',
          body: JSON.stringify(body),
        });
        clearEditingRenameState();
        syncFromPayload(data, { forcePacksRender: true });
        if (state.bench.packId === packId && (!variantId || state.bench.variantId === variantId)) {
          if (variantId && state.bench.variant) {
            state.bench.variant.name = cleanName;
            state.bench.variant.label = cleanName;
          }
          syncBenchCharacterOptions();
        }
        showPacksNotice(`已重命名为「${cleanName}」`, 'ok');
        return true;
      } catch (err) {
        showPacksNotice(err, 'err');
        return false;
      }
    }

    async function moveVariant({ sourcePackId, variantId, variantName, targetPackId, targetPackName }) {
      try {
        const payload = { sourcePackId, variantId };
        if (targetPackId && targetPackId !== '__new__') {
          payload.targetPackId = targetPackId;
        } else {
          const cleanTarget = String(targetPackName || '').trim();
          if (!cleanTarget) {
            showPacksNotice('请输入新归属的名称。', 'err');
            return false;
          }
          payload.targetPackId = '__new__';
          payload.targetPackName = cleanTarget;
        }
        const wasOpenInBench = state.bench.packId === sourcePackId && state.bench.variantId === variantId;
        const data = await api('/api/packs/move-variant', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        if (wasOpenInBench && data.targetPackId && data.variantId) {
          state.bench.packId = data.targetPackId;
          state.bench.variantId = data.variantId;
          state.bench.variant = null;
        }
        syncFromPayload(data);
        if (wasOpenInBench && data.targetPackId && data.variantId) {
          await loadBenchCharacter(data.targetPackId, data.variantId, { keepSelection: true });
        }
        const destPack = (data.packs || state.packs).find((p) => p.id === data.targetPackId);
        const destLabel = destPack?.name || targetPackName || '目标归属';
        const extraNote = data.sourcePackRemoved ? '，原空归属已清理' : '';
        showPacksNotice(`已将「${variantName || variantId}」移至「${destLabel}」${extraNote}`, 'ok');
        return true;
      } catch (err) {
        showPacksNotice(err, 'err');
        return false;
      }
    }

    function confirmDeletePackOrVariant(pack, variant = null) {
      closeMovePopover();
      const variantsCount = Array.isArray(pack.variants) ? pack.variants.length : 0;
      const isPackDelete = !variant;
      const isLastVariant = Boolean(variant) && variantsCount <= 1;
      const isActive = isPackDelete
        ? state.packId === pack.id
        : (state.packId === pack.id && state.scheme === variant.id);

      const fallbackHint = isActive ? '当前正启用该形象，删除后会自动切换至其他可用形象。' : '';
      let title = '';
      let desc = '';
      if (isPackDelete) {
        const previewNames = (pack.variants || []).map((x) => x.name || x.id).slice(0, 3).join('、');
        const more = variantsCount > 3 ? ` 等 ${variantsCount} 个方案` : (variantsCount === 1 ? '（含唯一 1 个方案）' : `（共 ${variantsCount} 个方案）`);
        title = `删除归属「${pack.name || pack.id}」`;
        desc = `确定删除归属「${pack.name || pack.id}」及其下的 ${previewNames}${more}吗？此操作不可恢复。${fallbackHint}`;
      } else if (isLastVariant) {
        title = `删除方案「${variant.name || variant.id}」`;
        desc = `「${variant.name || variant.id}」是归属「${pack.name || pack.id}」下的唯一方案，删除后该归属将一并移除且不可恢复。${fallbackHint}`;
      } else {
        title = `删除方案「${variant.name || variant.id}」`;
        desc = `确定从归属「${pack.name || pack.id}」中删除「${variant.name || variant.id}」吗？此操作不可恢复。${fallbackHint}`;
      }

      openModal({
        mode: 'confirm',
        title,
        desc,
        confirmLabel: '确认删除',
        danger: true,
        onConfirm: async () => {
          await deletePackOrVariant(pack.id, variant ? variant.id : '');
        },
      });
    }

    async function deletePackOrVariant(packId, variantId = '') {
      try {
        state.confirmDeleteKey = '';
        const deletedBench = state.bench.packId === packId && (!variantId || state.bench.variantId === variantId);
        const data = await api('/api/packs/delete', {
          method: 'POST',
          body: JSON.stringify(variantId ? { packId, variantId } : { packId }),
        });
        if (deletedBench) {
          state.bench.packId = '';
          state.bench.variantId = '';
          state.bench.variant = null;
          state.bench.atlasImg = null;
          state.bench.rowSpecs = [];
          state.bench.staticSpecs = [];
        }
        syncFromPayload(data);
        showPacksNotice('已删除所选内容', 'ok');
        showToast('已删除所选形象', 'ok');
      } catch (err) {
        showPacksNotice(err, 'err');
        showToast(err, 'err');
      }
    }

    function getStyleRefPresets() {
      const presets = [];
      for (const p of state.packs) {
        if (p.isBuiltin) continue;
        for (const v of p.variants || []) {
          presets.push({ packId: p.id, variantId: v.id, name: v.name || v.id, thumbUrl: v.thumbUrl || '' });
        }
      }
      return presets;
    }

    function syncStyleRefFallback(presets = getStyleRefPresets()) {
      if (state.styleRef.mode !== 'preset' || !Array.isArray(state.packs) || state.packs.length === 0) {
        return;
      }
      if (presets.length === 0) {
        state.styleRef.packId = '';
        state.styleRef.variantId = '';
        return;
      }
      const exists = presets.some((x) => x.packId === state.styleRef.packId && x.variantId === state.styleRef.variantId);
      if (!exists) {
        const preferred =
          presets.find((x) => x.packId === 'six-cats' && x.variantId === '22') ||
          presets.find((x) => x.packId === 'six-cats') ||
          presets[0];
        state.styleRef.packId = preferred.packId;
        state.styleRef.variantId = preferred.variantId;
      }
    }

    function renderStyleRefPanel() {
      const presets = getStyleRefPresets();
      syncStyleRefFallback(presets);

      const panel = $('styleRefPanel');
      panel.classList.toggle('hidden', !state.modelAssist);
      if (!state.modelAssist) return;

      const strip = $('styleRefStrip');
      strip.innerHTML = '';

      if (state.styleRef.mode === 'upload' && state.styleRef.dataUrl) {
        const upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'style-chip is-active';
        const img = document.createElement('img');
        img.src = state.styleRef.dataUrl;
        img.alt = state.styleRef.name || '参考图';
        const span = document.createElement('span');
        span.textContent = state.styleRef.name || '自定义参考图';
        upBtn.appendChild(img);
        upBtn.appendChild(span);
        upBtn.onclick = () => $('inpStyleRef').click();
        strip.appendChild(upBtn);
      }

      for (const pr of presets) {
        const active = state.styleRef.mode === 'preset' && state.styleRef.packId === pr.packId && state.styleRef.variantId === pr.variantId;
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'style-chip' + (active ? ' is-active' : '');
        if (pr.thumbUrl) {
          const img = document.createElement('img');
          img.src = pr.thumbUrl;
          img.alt = pr.name;
          chip.appendChild(img);
        }
        const span = document.createElement('span');
        span.textContent = pr.name;
        chip.appendChild(span);
        chip.onclick = () => {
          state.styleRef.mode = 'preset';
          state.styleRef.packId = pr.packId;
          state.styleRef.variantId = pr.variantId;
          renderStyleRefPanel();
        };
        strip.appendChild(chip);
      }
    }

    function togglePackCollapse(packId) {
      if (!packId) return;
      state.collapsedPacks[packId] = !state.collapsedPacks[packId];
      if (!state.collapsedPacks[packId]) {
        delete state.collapsedPacks[packId];
      }
      saveJsonStorage(STORAGE_KEYS.packs, state.collapsedPacks);
      const card = document.querySelector(`.pack-card[data-pack-id="${CSS.escape(packId)}"]`);
      if (card && !state.editingPackId && !state.editingVariantKey) {
        const collapsed = Boolean(state.collapsedPacks[packId]);
        card.classList.toggle('is-collapsed', collapsed);
        const btn = card.querySelector('[data-pack-collapse]');
        if (btn) {
          btn.setAttribute('aria-expanded', String(!collapsed));
          btn.title = collapsed ? '展开归属' : '折叠归属';
        }
        const activePill = card.querySelector('.pack-active-pill');
        if (activePill) {
          activePill.classList.toggle('hidden', !collapsed || packId !== state.packId);
        }
        syncPacksCollapseActionsUI();
        return;
      }
      if (!isPacksInteractionLocked()) {
        renderPacks();
      }
    }

    function setAllPacksCollapsed(shouldCollapse) {
      if (state.collapsedSections.packs) {
        delete state.collapsedSections.packs;
        saveJsonStorage(STORAGE_KEYS.sections, state.collapsedSections);
        applySectionCollapseUI();
      }
      const next = {};
      if (shouldCollapse) {
        for (const p of state.packs) {
          next[p.id] = true;
        }
      }
      state.collapsedPacks = next;
      saveJsonStorage(STORAGE_KEYS.packs, state.collapsedPacks);
      if (!isPacksInteractionLocked()) {
        renderPacks();
      }
    }

    function syncPacksCollapseActionsUI() {
      const expandBtn = $('btnPacksExpandAll');
      const collapseBtn = $('btnPacksCollapseAll');
      if (!expandBtn || !collapseBtn) return;
      const total = state.packs.length;
      const collapsedCount = state.packs.filter((p) => Boolean(state.collapsedPacks[p.id])).length;
      expandBtn.style.opacity = (total > 0 && collapsedCount === 0 && !state.collapsedSections.packs) ? '0.5' : '1';
      collapseBtn.style.opacity = (total > 0 && collapsedCount === total) ? '0.5' : '1';
    }

    function startPackRename(packId) {
      closeMovePopover();
      const pack = state.packs.find((p) => p.id === packId);
      const initialVal = pack ? (pack.name || pack.slotLabel || pack.id) : packId;
      state.editingVariantKey = '';
      state.editingPackId = packId;
      state.editingOriginalValue = initialVal;
      state.editingDraftValue = initialVal;
      state.imeComposing = false;
      renderPacks();
      const inp = document.querySelector(`[data-rename-pack-input="${CSS.escape(packId)}"]`);
      if (inp) {
        inp.focus();
        inp.select();
      }
    }

    function startVariantRename(packId, variantId) {
      closeMovePopover();
      if (state.collapsedPacks[packId]) {
        delete state.collapsedPacks[packId];
        saveJsonStorage(STORAGE_KEYS.packs, state.collapsedPacks);
      }
      const pack = state.packs.find((p) => p.id === packId);
      const v = pack?.variants?.find((x) => x.id === variantId);
      const initialVal = v ? (v.name || v.label || v.id) : variantId;
      state.editingPackId = '';
      state.editingVariantKey = `${packId}::${variantId}`;
      state.editingOriginalValue = initialVal;
      state.editingDraftValue = initialVal;
      state.imeComposing = false;
      renderPacks();
      const inp = document.querySelector(`[data-rename-var-input="${CSS.escape(`${packId}::${variantId}`)}"]`);
      if (inp) {
        inp.focus();
        inp.select();
      }
    }

    function clearVariantDragUI() {
      state.dragVariant = null;
      document.querySelectorAll('.variant-wrap.is-dragging').forEach((el) => el.classList.remove('is-dragging'));
      document.querySelectorAll('.pack-card.is-drop-target').forEach((el) => el.classList.remove('is-drop-target'));
      const npz = $('newPackDropZone');
      if (npz) {
        npz.classList.remove('is-drop-target');
        npz.classList.add('hidden');
      }
    }

    function renderPacks() {
      state.pendingPacksRender = false;
      const grid = $('packsGrid');
      grid.innerHTML = '';

      const sel = $('targetPackSelect');
      const prevTarget = sel.value;
      sel.innerHTML = '<option value="__new__">+ 新建方案</option>';

      for (const pack of state.packs) {
        if (!pack.isBuiltin) {
          const opt = document.createElement('option');
          opt.value = pack.id;
          opt.textContent = pack.name || pack.slotLabel || pack.id;
          sel.appendChild(opt);
        }

        const isActivePack = pack.id === state.packId;
        const hasEditingVarInPack = state.editingVariantKey && state.editingVariantKey.startsWith(`${pack.id}::`);
        const isPackCollapsed = Boolean(state.collapsedPacks[pack.id]) && !hasEditingVarInPack;

        const card = document.createElement('div');
        card.className = 'pack-card' + (isPackCollapsed ? ' is-collapsed' : '');
        card.dataset.packId = pack.id;

        if (!pack.isBuiltin) {
          card.addEventListener('dragenter', (e) => {
            if (!state.dragVariant || state.dragVariant.sourcePackId === pack.id) return;
            e.preventDefault();
            card.classList.add('is-drop-target');
          });
          card.addEventListener('dragover', (e) => {
            if (!state.dragVariant || state.dragVariant.sourcePackId === pack.id) return;
            e.preventDefault();
            if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
            card.classList.add('is-drop-target');
          });
          card.addEventListener('dragleave', (e) => {
            if (!e.relatedTarget || !card.contains(e.relatedTarget)) {
              card.classList.remove('is-drop-target');
            }
          });
          card.addEventListener('drop', (e) => {
            const drag = state.dragVariant;
            if (!drag || drag.sourcePackId === pack.id) return;
            e.preventDefault();
            e.stopPropagation();
            clearVariantDragUI();
            moveVariant({
              sourcePackId: drag.sourcePackId,
              variantId: drag.variantId,
              variantName: drag.variantName,
              targetPackId: pack.id,
              targetPackName: pack.name || pack.id,
            });
          });
        }

        const head = document.createElement('div');
        head.className = 'pack-head';

        const titleGroup = document.createElement('div');
        titleGroup.className = 'pack-title-group';
        const packDisplayName = pack.name || pack.slotLabel || pack.id;

        const collapseBtn = document.createElement('button');
        collapseBtn.type = 'button';
        collapseBtn.className = 'pack-collapse-btn';
        collapseBtn.dataset.packCollapse = pack.id;
        collapseBtn.setAttribute('aria-expanded', String(!isPackCollapsed));
        collapseBtn.setAttribute('aria-label', `${isPackCollapsed ? '展开' : '折叠'} ${packDisplayName}`);
        collapseBtn.title = isPackCollapsed ? '展开归属' : '折叠归属';
        collapseBtn.appendChild(createChevronIcon(13));
        collapseBtn.onclick = (ev) => {
          ev.stopPropagation();
          togglePackCollapse(pack.id);
        };
        titleGroup.appendChild(collapseBtn);

        head.addEventListener('click', (ev) => {
          if (state.editingPackId === pack.id) return;
          const t = ev.target;
          if (t === head || t === titleGroup || (t && t.classList && (t.classList.contains('pack-count-tag') || t.classList.contains('pack-active-pill')))) {
            togglePackCollapse(pack.id);
          }
        });

        if (!pack.isBuiltin && state.editingPackId === pack.id) {
          const form = document.createElement('form');
          form.className = 'inline-rename-form';
          form.draggable = false;
          stopRenamePropagation(form);

          const inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'inline-rename-input';
          inp.maxLength = 48;
          inp.draggable = false;
          inp.value = state.editingDraftValue !== '' || state.editingOriginalValue !== ''
            ? state.editingDraftValue
            : packDisplayName;
          inp.dataset.renamePackInput = pack.id;
          inp.setAttribute('aria-label', '编辑归属名称');
          stopRenamePropagation(inp);

          let submitting = false;
          let canceling = false;
          let closed = false;
          let imeComposing = false;

          const cancelEdit = () => {
            if (closed || submitting) return;
            closed = true;
            canceling = true;
            clearEditingRenameState();
            renderPacks();
          };

          const commit = async ({ fromBlur = false } = {}) => {
            if (submitting || closed || canceling) return;
            const nextVal = inp.value.trim();
            if (!nextVal) {
              if (fromBlur) {
                cancelEdit();
                return;
              }
              showPacksNotice('归属名称不能为空。', 'err');
              inp.focus();
              return;
            }
            if (nextVal === packDisplayName) {
              closed = true;
              clearEditingRenameState();
              renderPacks();
              return;
            }
            submitting = true;
            inp.disabled = true;
            const ok = await renamePackOrVariant({ packId: pack.id, name: nextVal });
            submitting = false;
            if (ok) {
              closed = true;
            } else if (state.editingPackId === pack.id) {
              inp.disabled = false;
              inp.focus();
            }
          };

          activeRenameOutsideCommit = () => {
            if (closed || submitting || canceling || imeComposing || state.imeComposing) return;
            commit({ fromBlur: true });
          };

          inp.addEventListener('compositionstart', () => {
            imeComposing = true;
            state.imeComposing = true;
          });
          inp.addEventListener('compositionend', () => {
            imeComposing = false;
            state.imeComposing = false;
            state.editingDraftValue = inp.value;
          });
          inp.addEventListener('input', () => {
            state.editingDraftValue = inp.value;
          });
          inp.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.isComposing || imeComposing || e.keyCode === 229) return;
            if (e.key === 'Escape') {
              e.preventDefault();
              cancelEdit();
            } else if (e.key === 'Enter') {
              e.preventDefault();
              commit({ fromBlur: false });
            }
          });
          inp.addEventListener('blur', (e) => {
            if (closed || submitting || canceling || imeComposing || state.imeComposing) return;
            if (e.relatedTarget && form.contains(e.relatedTarget)) return;
            setTimeout(() => {
              if (closed || submitting || canceling || imeComposing || state.imeComposing) return;
              if (!inp.isConnected) return;
              if (document.activeElement && form.contains(document.activeElement)) return;
              commit({ fromBlur: true });
            }, 0);
          });

          const saveBtn = document.createElement('button');
          saveBtn.type = 'submit';
          saveBtn.className = 'inline-rename-btn is-save';
          saveBtn.title = '保存';
          saveBtn.setAttribute('aria-label', '保存归属名称');
          saveBtn.appendChild(createCheckIcon(12));
          saveBtn.addEventListener('mousedown', (e) => e.preventDefault());

          const cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.className = 'inline-rename-btn';
          cancelBtn.title = '取消 (Esc)';
          cancelBtn.setAttribute('aria-label', '取消编辑');
          cancelBtn.appendChild(createCloseIcon());
          cancelBtn.addEventListener('pointerdown', (e) => {
            canceling = true;
            e.preventDefault();
          });
          cancelBtn.addEventListener('mousedown', (e) => {
            canceling = true;
            e.preventDefault();
          });
          cancelBtn.onclick = (ev) => {
            ev.stopPropagation();
            cancelEdit();
          };

          form.onsubmit = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (imeComposing || state.imeComposing) return;
            commit({ fromBlur: false });
          };

          form.appendChild(inp);
          form.appendChild(saveBtn);
          form.appendChild(cancelBtn);
          titleGroup.appendChild(form);
        } else {
          const title = document.createElement('div');
          title.className = 'pack-title' + (!pack.isBuiltin ? ' is-editable' : '');
          title.textContent = packDisplayName;
          if (!pack.isBuiltin) {
            title.title = '双击修改归属名称';
            title.ondblclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              startPackRename(pack.id);
            };
          } else {
            title.style.cursor = 'pointer';
            title.onclick = (e) => {
              e.stopPropagation();
              togglePackCollapse(pack.id);
            };
          }
          titleGroup.appendChild(title);

          if (!pack.isBuiltin) {
            const editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = 'icon-inline-btn';
            editBtn.title = '重命名归属';
            editBtn.setAttribute('aria-label', `重命名归属 ${packDisplayName}`);
            editBtn.appendChild(createPencilIcon(12));
            editBtn.onclick = (ev) => {
              ev.stopPropagation();
              startPackRename(pack.id);
            };
            titleGroup.appendChild(editBtn);
          }

          const countTag = document.createElement('span');
          countTag.className = 'pack-count-tag';
          const vLen = Array.isArray(pack.variants) ? pack.variants.length : 0;
          countTag.textContent = pack.isBuiltin ? `内置 · ${vLen}` : `${vLen} 个方案`;
          titleGroup.appendChild(countTag);

          const activePill = document.createElement('span');
          activePill.className = 'pack-active-pill' + (isPackCollapsed && isActivePack ? '' : ' hidden');
          activePill.textContent = '当前启用';
          titleGroup.appendChild(activePill);
        }

        head.appendChild(titleGroup);

        if (!pack.isBuiltin) {
          const actions = document.createElement('div');
          actions.className = 'pack-actions';

          const dropHint = document.createElement('span');
          dropHint.className = 'pack-drop-badge';
          dropHint.textContent = '松开移入此归属';
          actions.appendChild(dropHint);

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'link-btn';
          delBtn.textContent = '删除';
          delBtn.title = `删除归属 ${packDisplayName}`;
          delBtn.onclick = (ev) => {
            ev.stopPropagation();
            confirmDeletePackOrVariant(pack, null);
          };
          actions.appendChild(delBtn);

          head.appendChild(actions);
        }

        card.appendChild(head);

        const vGrid = document.createElement('div');
        vGrid.className = 'variants-grid';

        for (const v of pack.variants || []) {
          const isSelected = isActivePack && state.scheme === v.id;
          const vKey = `${pack.id}::${v.id}`;
          const isEditingThisVar = !pack.isBuiltin && state.editingVariantKey === vKey;
          const wrap = document.createElement('div');
          wrap.className = 'variant-wrap' + (state.moveMenu && state.moveMenu.sourcePackId === pack.id && state.moveMenu.variantId === v.id ? ' has-open-menu' : '');

          if (!pack.isBuiltin && !isEditingThisVar) {
            wrap.draggable = true;
            wrap.addEventListener('dragstart', (e) => {
              closeMovePopover();
              state.dragVariant = {
                sourcePackId: pack.id,
                variantId: v.id,
                variantName: v.name || v.id,
              };
              if (e.dataTransfer) {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('application/x-hachimi-variant', JSON.stringify(state.dragVariant));
                e.dataTransfer.setData('text/plain', vKey);
              }
              requestAnimationFrame(() => {
                wrap.classList.add('is-dragging');
                const npz = $('newPackDropZone');
                if (npz) npz.classList.remove('hidden');
              });
            });
            wrap.addEventListener('dragend', () => {
              clearVariantDragUI();
            });
          } else {
            wrap.draggable = false;
          }

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'variant-item' + (isSelected ? ' is-selected' : '');
          btn.dataset.packId = pack.id;
          btn.dataset.variantId = v.id;
          btn.onclick = (e) => {
            if (isEditingThisVar) return;
            if (e.detail >= 2 && !pack.isBuiltin) return;
            selectPack(pack.id, v.id);
          };

          const thumb = document.createElement('div');
          thumb.className = 'variant-thumb';
          if (v.thumbUrl) {
            const img = document.createElement('img');
            img.src = v.thumbUrl;
            img.alt = v.name || v.id;
            img.loading = 'lazy';
            img.draggable = false;
            thumb.appendChild(img);
          }

          btn.appendChild(thumb);

          if (!isEditingThisVar) {
            const name = document.createElement('div');
            name.className = 'variant-name';
            name.textContent = v.name || v.label || v.id;
            if (!pack.isBuiltin) {
              name.title = '双击或点击右上角编辑名称，拖拽可跨归属移动';
              name.ondblclick = (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                startVariantRename(pack.id, v.id);
              };
            }
            btn.appendChild(name);
          }
          wrap.appendChild(btn);

          if (isEditingThisVar) {
            const vDisplayName = v.name || v.label || v.id;
            const form = document.createElement('form');
            form.className = 'variant-rename-box';
            form.draggable = false;
            stopRenamePropagation(form);

            const inp = document.createElement('input');
            inp.type = 'text';
            inp.className = 'variant-rename-input';
            inp.maxLength = 48;
            inp.draggable = false;
            inp.value = state.editingDraftValue !== '' || state.editingOriginalValue !== ''
              ? state.editingDraftValue
              : vDisplayName;
            inp.dataset.renameVarInput = vKey;
            inp.setAttribute('aria-label', '编辑方案名称');
            stopRenamePropagation(inp);

            let vSubmitting = false;
            let vCanceling = false;
            let vClosed = false;
            let imeComposing = false;

            const cancelVarEdit = () => {
              if (vClosed || vSubmitting) return;
              vClosed = true;
              vCanceling = true;
              clearEditingRenameState();
              renderPacks();
            };

            const commitVar = async ({ fromBlur = false } = {}) => {
              if (vSubmitting || vClosed || vCanceling) return;
              const nextVal = inp.value.trim();
              if (!nextVal) {
                if (fromBlur) {
                  cancelVarEdit();
                  return;
                }
                showPacksNotice('方案名称不能为空。', 'err');
                inp.focus();
                return;
              }
              if (nextVal === vDisplayName) {
                vClosed = true;
                clearEditingRenameState();
                renderPacks();
                return;
              }
              vSubmitting = true;
              inp.disabled = true;
              const ok = await renamePackOrVariant({ packId: pack.id, variantId: v.id, name: nextVal });
              vSubmitting = false;
              if (ok) {
                vClosed = true;
              } else if (state.editingVariantKey === vKey) {
                inp.disabled = false;
                inp.focus();
              }
            };

            activeRenameOutsideCommit = () => {
              if (vClosed || vSubmitting || vCanceling || imeComposing || state.imeComposing) return;
              commitVar({ fromBlur: true });
            };

            inp.addEventListener('compositionstart', () => {
              imeComposing = true;
              state.imeComposing = true;
            });
            inp.addEventListener('compositionend', () => {
              imeComposing = false;
              state.imeComposing = false;
              state.editingDraftValue = inp.value;
            });
            inp.addEventListener('input', () => {
              state.editingDraftValue = inp.value;
            });
            inp.addEventListener('keydown', (e) => {
              e.stopPropagation();
              if (e.isComposing || imeComposing || e.keyCode === 229) return;
              if (e.key === 'Escape') {
                e.preventDefault();
                cancelVarEdit();
              } else if (e.key === 'Enter') {
                e.preventDefault();
                commitVar({ fromBlur: false });
              }
            });
            inp.addEventListener('blur', (e) => {
              if (vClosed || vSubmitting || vCanceling || imeComposing || state.imeComposing) return;
              if (e.relatedTarget && form.contains(e.relatedTarget)) return;
              setTimeout(() => {
                if (vClosed || vSubmitting || vCanceling || imeComposing || state.imeComposing) return;
                if (!inp.isConnected) return;
                if (document.activeElement && form.contains(document.activeElement)) return;
                commitVar({ fromBlur: true });
              }, 0);
            });

            const btnRow = document.createElement('div');
            btnRow.className = 'variant-rename-actions';

            const saveBtn = document.createElement('button');
            saveBtn.type = 'submit';
            saveBtn.className = 'variant-rename-act is-save';
            saveBtn.title = '保存 (Enter)';
            saveBtn.setAttribute('aria-label', '保存方案名称');
            saveBtn.textContent = '保存';
            saveBtn.addEventListener('mousedown', (e) => e.preventDefault());

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'variant-rename-act';
            cancelBtn.title = '取消 (Esc)';
            cancelBtn.setAttribute('aria-label', '取消编辑');
            cancelBtn.textContent = '取消';
            cancelBtn.addEventListener('pointerdown', (e) => {
              vCanceling = true;
              e.preventDefault();
            });
            cancelBtn.addEventListener('mousedown', (e) => {
              vCanceling = true;
              e.preventDefault();
            });
            cancelBtn.onclick = (ev) => {
              ev.stopPropagation();
              cancelVarEdit();
            };

            btnRow.appendChild(saveBtn);
            btnRow.appendChild(cancelBtn);

            form.onsubmit = (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              if (imeComposing || state.imeComposing) return;
              commitVar({ fromBlur: false });
            };
            form.appendChild(inp);
            form.appendChild(btnRow);
            wrap.appendChild(form);
          }

          if (!pack.isBuiltin && !isEditingThisVar) {
            const cardActs = document.createElement('div');
            cardActs.className = 'variant-card-actions';

            const renBtn = document.createElement('button');
            renBtn.type = 'button';
            renBtn.className = 'variant-act-btn';
            renBtn.title = '重命名方案';
            renBtn.setAttribute('aria-label', `重命名 ${v.name || v.id}`);
            renBtn.appendChild(createPencilIcon(11));
            renBtn.onclick = (ev) => {
              ev.stopPropagation();
              startVariantRename(pack.id, v.id);
            };

            const moveBtn = document.createElement('button');
            moveBtn.type = 'button';
            moveBtn.className = 'variant-act-btn';
            moveBtn.title = '移动至其他归属';
            moveBtn.setAttribute('aria-label', `移动 ${v.name || v.id} 到其他归属`);
            moveBtn.appendChild(createMoveIcon(11));
            moveBtn.onclick = (ev) => {
              ev.stopPropagation();
              openMovePopover(pack, v, moveBtn);
            };

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'variant-act-btn is-danger';
            delBtn.title = '删除方案';
            delBtn.setAttribute('aria-label', `删除 ${v.name || v.id}`);
            delBtn.appendChild(createTrashIcon(11));
            delBtn.onclick = (ev) => {
              ev.stopPropagation();
              confirmDeletePackOrVariant(pack, v);
            };

            cardActs.appendChild(renBtn);
            cardActs.appendChild(moveBtn);
            cardActs.appendChild(delBtn);
            wrap.appendChild(cardActs);
          }

          vGrid.appendChild(wrap);
        }
        card.appendChild(vGrid);
        grid.appendChild(card);
      }

      const newPackDropZone = document.createElement('div');
      newPackDropZone.id = 'newPackDropZone';
      newPackDropZone.className = 'new-pack-dropzone' + (state.dragVariant ? '' : ' hidden');
      newPackDropZone.appendChild(createFolderPlusIcon(16));
      const npzText = document.createElement('span');
      npzText.textContent = '+ 移入新归属（拖放方案至此新建归属）';
      newPackDropZone.appendChild(npzText);
      newPackDropZone.addEventListener('dragenter', (e) => {
        if (!state.dragVariant) return;
        e.preventDefault();
        newPackDropZone.classList.add('is-drop-target');
      });
      newPackDropZone.addEventListener('dragover', (e) => {
        if (!state.dragVariant) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        newPackDropZone.classList.add('is-drop-target');
      });
      newPackDropZone.addEventListener('dragleave', (e) => {
        if (!e.relatedTarget || !newPackDropZone.contains(e.relatedTarget)) {
          newPackDropZone.classList.remove('is-drop-target');
        }
      });
      newPackDropZone.addEventListener('drop', (e) => {
        const drag = state.dragVariant;
        if (!drag) return;
        e.preventDefault();
        e.stopPropagation();
        clearVariantDragUI();
        openModal({
          mode: 'prompt',
          title: `将「${drag.variantName}」移入新归属`,
          desc: '请输入新建归属的名称：',
          confirmLabel: '创建并移入',
          danger: false,
          initialValue: '',
          placeholder: '例如：新猫咪合集',
          onConfirm: async (val) => {

              $('modalErr').textContent = '请输入新归属的名称。';
              $('modalErr').classList.remove('hidden');
              $('modalInput').focus();
              return false;
            }

              $('modalErr').textContent = '名称长度请控制在 48 个字以内。';
              $('modalErr').classList.remove('hidden');
              $('modalInput').focus();
              return false;
            }
            await moveVariant({
              sourcePackId: drag.sourcePackId,
              variantId: drag.variantId,
              variantName: drag.variantName,
              targetPackId: '__new__',
              targetPackName: clean,
            });
            return true;
          },
        });
      });
      grid.appendChild(newPackDropZone);

      if ([...sel.options].some((o) => o.value === prevTarget)) {
        sel.value = prevTarget;
      }
      updateTargetPackVisibility();
      renderStyleRefPanel();
      syncBenchCharacterOptions();
      syncPacksCollapseActionsUI();

    function updateTargetPackVisibility() {
      const isNew = $('targetPackSelect').value === '__new__';
      $('packNameField').classList.toggle('hidden', !isNew);
    }

    function syncFromPayload(data, { forcePacksRender = false } = {}) {
      if (!data) return;
      if (Array.isArray(data.packs)) {
        state.packs = data.packs;
        syncStyleRefFallback();
      }
      if (data.activePack !== undefined) state.activePack = data.activePack;
      if (data.settings) {
        state.settings = { ...state.settings, ...data.settings };
        state.packId = data.settings.packId || state.packId;
        state.scheme = data.settings.scheme || state.scheme;
      } else if (data.palette) {
        state.settings.palette = data.palette;
      }
      renderSettingsControls();
      if (!forcePacksRender && isPacksInteractionLocked()) {
        state.pendingPacksRender = true;
        syncActiveAvatarAndSelectionInPlace();
        return;
      }
      state.pendingPacksRender = false;
      renderPacks();
    }

    async function refreshState() {
      try {
        const data = await api('/api/state');
        syncFromPayload(data);
      } catch (err) {
        showToast(err, 'err');
      }

    async function updateSettings(patch) {
      state.settings = { ...state.settings, ...patch };
      renderSettingsControls();
      try {
        const res = await api('/api/settings', {
          method: 'POST',
          body: JSON.stringify(patch),
        });
        if (res && res.settings) {
          state.settings = { ...state.settings, ...res.settings };
          renderSettingsControls();
        }
      } catch (err) {
        showToast(err, 'err');
      }
    }

    async function selectPack(packId, scheme) {
      try {
        const body = scheme ? { packId, scheme } : { packId };
        const data = await api('/api/packs/select', {
          method: 'POST',
          body: JSON.stringify(body),
        });
        state.packs = data.packs || state.packs;
        state.activePack = data.activePack || null;
        state.packId = data.packId;
        state.scheme = data.scheme;
        if (data.packId && data.packId !== 'hachimi' && data.scheme) {

    function readBlobAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('读取图片失败'));
        reader.readAsDataURL(file);
      });
    }

    async function isAnimatedWebp(file) {
      try {
        const slice = await file.slice(0, 4096).arrayBuffer();
        const bytes = new Uint8Array(slice);
        if (bytes.length < 16) return false;
        const header = String.fromCharCode(...bytes.slice(0, 4)) + String.fromCharCode(...bytes.slice(8, 12));
        if (header !== 'RIFFWEBP') return false;
        for (let i = 12; i < bytes.length - 4; i++) {
          const c0 = bytes[i], c1 = bytes[i + 1], c2 = bytes[i + 2], c3 = bytes[i + 3];
          if ((c0 === 65 && c1 === 78 && c2 === 73 && c3 === 77) || (c0 === 65 && c1 === 78 && c2 === 77 && c3 === 70)) {
            return true;
          }
        }
      } catch {}
      return false;
    }

    async function prepareImageFile(file) {
      if (!file) throw new Error('请选择有效的图片文件');
      const name = String(file.name || 'image.png');
      const mime = String(file.type || '').toLowerCase();
      if (/\.(heic|heif|avif|svg|tiff?)$/i.test(name) || /heic|heif|avif|svg|tiff/i.test(mime)) {
        throw new Error('这张图片格式暂不支持或文件已损坏，请改用 PNG、JPG、WebP 或动图 GIF。');
      }
      if (mime && !mime.startsWith('image/') && !/\.(png|webp|jpe?g|gif)$/i.test(name)) {
        throw new Error('这张图片格式暂不支持或文件已损坏，请改用 PNG、JPG、WebP 或动图 GIF。');
      }

      const rawDataUrl = await readBlobAsDataUrl(file);
      const isGif = mime === 'image/gif' || /\.gif$/i.test(name);
      if (isGif) {
        return { name, dataUrl: rawDataUrl };
      }
      if (mime === 'image/webp' || /\.webp$/i.test(name)) {
        if (await isAnimatedWebp(file)) {
          return { name, dataUrl: rawDataUrl };
        }
      }

      return await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth || 0;
          const h = img.naturalHeight || 0;
          if (!w || !h) {
            reject(new Error('这张图片格式暂不支持或文件已损坏，请改用 PNG、JPG、WebP 或动图 GIF。'));
            return;
          }
          const isJpeg = mime === 'image/jpeg' || mime === 'image/jpg' || /\.jpe?g$/i.test(name);
          const maxSide = Math.max(w, h);
          const limitSide = isJpeg ? 1600 : 2048;
          if (maxSide <= limitSide) {
            resolve({ name, dataUrl: rawDataUrl });
            return;
          }
          const ratio = limitSide / maxSide;
          const nw = Math.max(1, Math.round(w * ratio));
          const nh = Math.max(1, Math.round(h * ratio));
          const canvas = document.createElement('canvas');
          canvas.width = nw;
          canvas.height = nh;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            resolve({ name, dataUrl: rawDataUrl });
            return;
          }
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, nw, nh);
          resolve({
            name,
            dataUrl: isJpeg ? canvas.toDataURL('image/jpeg', 0.92) : canvas.toDataURL('image/png'),
          });
        };
        img.onerror = () => {
          reject(new Error('这张图片格式暂不支持或文件已损坏，请改用 PNG、JPG、WebP 或动图 GIF。'));
        };
        img.src = rawDataUrl;
      });
    }

    function normalizeViewsArray(viewsRaw) {
      if (Array.isArray(viewsRaw)) {
        return viewsRaw.filter((v) => v && v.dataUrl);
      }
      if (viewsRaw && typeof viewsRaw === 'object') {
        const out = [];
        for (const { key, label } of FACET_SLOTS) {
          const val = viewsRaw[key];
          const canFlip = key === 'left_side' || key === 'right_side';
          if (Array.isArray(val)) {
            for (const u of val) {
              const url = typeof u === 'string' ? u : u?.dataUrl;
              if (url) out.push({ role: key, label, dataUrl: url, canFlip });
            }
          } else if (val) {
            const url = typeof val === 'string' ? val : val.dataUrl;
            if (url) out.push({ role: key, label, dataUrl: url, canFlip });
          }
        }
        if (viewsRaw.side) out.push({ role: 'side', label: '侧面', dataUrl: viewsRaw.side, canFlip: true });
        if (Array.isArray(viewsRaw.extras)) {
          for (const u of viewsRaw.extras) {
            if (u) out.push({ role: 'action', label: '动作姿态', dataUrl: u });
          }
        }
        return out;
      }
      return [];
    }

    function normalizeSmartRoleKey(rawRole) {
      const k = String(rawRole || '').trim().toLowerCase();
      if (k === 'extra') return 'action';
      if (k === 'side') return 'right_side';
      return k;
    }

    function renderRoleSummaryBar(containerEl, countsMap, totalCount) {
      if (!containerEl) return;
      containerEl.innerHTML = '';
      if (!totalCount) {
        containerEl.classList.add('hidden');
        return;
      }

      const orderedKeys = [...FACE_ROLES.map((r) => r.key), 'side', 'pending'];
      const labelMap = { ...ROLE_LABELS, pending: state.analyzing ? '识别中' : '待归类' };
      let added = 0;

      for (const key of orderedKeys) {
        const cnt = Number(countsMap[key] || 0);
        if (cnt <= 0) continue;
        const chip = document.createElement('span');
        chip.className = 'role-summary-chip' + (cnt > 1 ? ' is-multi' : '');
        chip.textContent = `${labelMap[key] || key} ×${cnt}`;
        containerEl.appendChild(chip);
        added++;
      }

      if (added === 0) {
        containerEl.classList.add('hidden');
        return;
      }

      const totalEl = document.createElement('span');
      totalEl.className = 'role-summary-total';
      totalEl.textContent = `共 ${totalCount} 张`;
      containerEl.appendChild(totalEl);
      containerEl.classList.remove('hidden');
    }

    function computeSmartSummaryCounts() {
      const counts = {};
      if (!state.analyzing && state.smartRoleCounts && state.smartFiles.length === 1 && state.smartViews.length > 1) {
        let total = 0;
        for (const { key } of FACE_ROLES) {
          const n = Number(state.smartRoleCounts[key] || 0);
          if (n > 0) {
            counts[key] = n;
            total += n;
          }
        }
        if (total > 0) return { counts, total };
      }

      for (const f of state.smartFiles) {
        const manual = f.roleHint && f.roleHint !== 'auto' ? f.roleHint : '';
        const rawKey = manual || f.role || '';
        if (rawKey === 'three-view' || rawKey === 'animated' || rawKey === 'grid-8x11' || rawKey === 'grid-4x3') {
          continue;
        }
        const key = rawKey ? normalizeSmartRoleKey(rawKey) : 'pending';
        counts[key] = (counts[key] || 0) + 1;
      }
      return { counts, total: state.smartFiles.length };
    }

      if (!el) return;
      el.innerHTML = '';

        .filter((w, i, arr) => w && w !== '操作没有成功，请换一张图片或稍后再试。' && arr.indexOf(w) === i);

      if (clean.length === 0) {
        el.classList.add('hidden');
        return;
      }
      const bar = document.createElement('div');
      bar.className = 'notice-bar';
      bar.style.width = '100%';
      bar.appendChild(createNoticeIcon('info'));
      const span = document.createElement('span');
      span.textContent = clean.join('；');
      bar.appendChild(span);
      el.appendChild(bar);
      el.classList.remove('hidden');
    }

      const dropZone = $('smartDropZone');
      const clearBtn = $('btnSmartClear');
