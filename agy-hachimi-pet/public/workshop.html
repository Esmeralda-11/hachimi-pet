            state.smartViews = [];
            state.smartRoleCounts = null;
            state.smartModeLabel = '';
            state.smartWarnings = [];
            state.smartFlipSide = false;
            showToast('');
          } else {
            runSmartAnalysis({ autoColor: false });
          }
          renderSmartImport();
        });
        thumb.appendChild(rmBtn);
        card.appendChild(thumb);

        const select = document.createElement('select');
        const currentRoleHint = item.roleHint || 'auto';
        const isManual = currentRoleHint !== 'auto';
        select.className = 'role-select' + (isManual ? ' is-manual' : '');
        select.setAttribute('aria-label', `${item.name || `图片 ${idx + 1}`} 视角归类`);

        const detectedLabel = item.autoRoleLabel
          || (!isManual ? (item.roleLabel || ROLE_LABELS[item.role] || '') : '')
          || (state.analyzing && !isManual ? '识别中' : '待识别');

        const autoOpt = document.createElement('option');
        autoOpt.value = 'auto';
        autoOpt.textContent = `自动识别（${detectedLabel}）`;
        select.appendChild(autoOpt);

        for (const r of FACE_ROLES) {
          const opt = document.createElement('option');
          opt.value = r.key;
          opt.textContent = r.label;
          select.appendChild(opt);
        }

        select.value = FACE_ROLES.some((r) => r.key === currentRoleHint) ? currentRoleHint : 'auto';
        select.addEventListener('change', () => {
          item.roleHint = select.value || 'auto';
          if (item.roleHint !== 'auto') {
            item.role = item.roleHint;
            item.roleLabel = ROLE_LABELS[item.roleHint] || item.roleHint;
          }
          renderSmartImport();
          runSmartAnalysis({ autoColor: false });
        });
        card.appendChild(select);
        grid.appendChild(card);
      });

      const { counts, total } = computeSmartSummaryCounts();
      renderRoleSummaryBar($('smartRoleSummary'), counts, total);

      const viewsStrip = $('smartViewsStrip');
      viewsStrip.innerHTML = '';
      viewsStrip.classList.toggle('is-loading', state.analyzing);

      const views = state.smartViews.length > 0
        ? state.smartViews
        : state.smartFiles.slice(0, 6).map((f, i) => {
            const r = (f.roleHint && f.roleHint !== 'auto') ? f.roleHint : (f.role || (i === 0 ? 'front' : 'action'));
            return {
              role: r,
              label: ROLE_LABELS[r] || '参考图',
              dataUrl: f.previewDataUrl || f.dataUrl,
              canFlip: r === 'left_side' || r === 'right_side' || r === 'side',
            };
          });

      for (const v of views) {
        const cell = document.createElement('div');
        cell.className = 'view-cell';

        const tag = document.createElement('span');
        tag.className = 'view-tag';
        tag.textContent = v.label || ROLE_LABELS[v.role] || '预览';
        cell.appendChild(tag);

        const img = document.createElement('img');
        img.src = v.dataUrl;
        img.alt = tag.textContent;
        cell.appendChild(img);

        if (v.canFlip || v.role === 'left_side' || v.role === 'right_side' || v.role === 'side') {
          const flipBtn = document.createElement('button');
          flipBtn.type = 'button';
          flipBtn.className = 'view-flip-btn' + (state.smartFlipSide ? ' is-flipped' : '');
          flipBtn.title = '左右翻转侧面';
          flipBtn.setAttribute('aria-label', '左右翻转侧面');
          flipBtn.appendChild(createFlipIcon());
          flipBtn.addEventListener('click', () => {
            state.smartFlipSide = !state.smartFlipSide;
            runSmartAnalysis({ autoColor: false });
          });
          cell.appendChild(flipBtn);
        }

        viewsStrip.appendChild(cell);
      }

      renderWarningsBar(warnEl, state.smartWarnings);
    }

    function renderFacetSlot(slotKey, label, areaEl) {
      const items = Array.isArray(state.facets[slotKey]) ? state.facets[slotKey] : [];
      const countBadge = document.querySelector(`[data-facet-count="${slotKey}"]`);
      if (countBadge) {
        countBadge.textContent = items.length > 0 ? `${items.length} 张` : '';
        countBadge.classList.toggle('is-filled', items.length > 0);
      }

      areaEl.innerHTML = '';
      areaEl.classList.toggle('is-empty', items.length === 0);
      areaEl.classList.toggle('has-files', items.length > 0);

      if (items.length === 0) {
        areaEl.tabIndex = 0;
        areaEl.setAttribute('role', 'button');
        const cue = document.createElement('span');
        cue.className = 'facet-empty-cue';
        cue.appendChild(createPlusIcon(16));
        const text = document.createElement('span');
        text.textContent = '选择或拖放图片';
        cue.appendChild(text);
        areaEl.appendChild(cue);
        return;
      }

      areaEl.removeAttribute('tabindex');
      areaEl.removeAttribute('role');

      items.forEach((item, idx) => {
        const box = document.createElement('div');
        box.className = 'facet-thumb-item';

        const img = document.createElement('img');
        img.src = item.dataUrl;
        img.alt = item.name || `${label} ${idx + 1}`;
        if ((slotKey === 'left_side' || slotKey === 'right_side') && state.facets.flipSide) {
          img.classList.add('is-mirrored');
        }
        box.appendChild(img);

        const rmBtn = document.createElement('button');
        rmBtn.type = 'button';
        rmBtn.className = 'remove-chip-btn';
        rmBtn.title = '移除';
        rmBtn.setAttribute('aria-label', `移除${label}图片`);
        rmBtn.appendChild(createCloseIcon());
        rmBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.facets[slotKey].splice(idx, 1);
          renderFacetedUpload();
          if (countFacetFiles() === 0) {
            state.facetedWarnings = [];
            renderWarningsBar($('facetedWarnings'), []);
          } else {
            runFacetedAnalysis({ autoColor: false });
          }
        });
        box.appendChild(rmBtn);
        areaEl.appendChild(box);
      });

      if (countFacetFiles() < 16) {
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'facet-add-tile';
        addBtn.title = `继续添加${label}图片`;
        addBtn.setAttribute('aria-label', `继续添加${label}图片`);
        addBtn.appendChild(createPlusIcon(15));
        addBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.activeFacetTarget = slotKey;
          $('inpFacetFiles').click();
        });
        areaEl.appendChild(addBtn);
      }
    }

    function renderFacetedUpload() {
      const counts = {};
      let total = 0;
      for (const slot of FACET_SLOTS) {
        const el = $(slot.areaId);
        if (el) renderFacetSlot(slot.key, slot.label, el);
        const n = Array.isArray(state.facets[slot.key]) ? state.facets[slot.key].length : 0;
        if (n > 0) {
          counts[slot.key] = n;
          total += n;
        }
      }
      $('chkFacetFlipSide').checked = Boolean(state.facets.flipSide);
      renderRoleSummaryBar($('facetedRoleSummary'), counts, total);
      renderWarningsBar($('facetedWarnings'), state.facetedWarnings);
    }

    function countFacetFiles() {
      let n = 0;
      for (const slot of FACET_SLOTS) {
        if (Array.isArray(state.facets[slot.key])) {
          n += state.facets[slot.key].length;
        }
      }
      return n;
    }

    function buildFacetsPayload() {
      const out = { flipSide: Boolean(state.facets.flipSide) };
      for (const slot of FACET_SLOTS) {
        const list = Array.isArray(state.facets[slot.key]) ? state.facets[slot.key] : [];
        if (list.length > 0) {
          out[slot.key] = list.map((x) => ({
            name: x.name,
            dataUrl: x.dataUrl,
            roleHint: slot.key,
          }));
        }
      }
      return out;
    }

    function pickDefaultFacetDropSlot() {
      for (const slot of FACET_SLOTS) {
        if (!Array.isArray(state.facets[slot.key]) || state.facets[slot.key].length === 0) {
          return slot.key;
        }
      }
      return 'action';
    }

    function switchImportTab(tab) {
      state.importTab = tab === 'faceted' ? 'faceted' : 'auto';
      const isSmart = state.importTab === 'auto';
      $('tabSmartImport').classList.toggle('is-active', isSmart);
      $('tabSmartImport').setAttribute('aria-selected', String(isSmart));
      $('tabFacetedImport').classList.toggle('is-active', !isSmart);
      $('tabFacetedImport').setAttribute('aria-selected', String(!isSmart));
      $('panelSmartImport').classList.toggle('hidden', !isSmart);
      $('panelFacetedImport').classList.toggle('hidden', isSmart);
      showToast('');
    }

    async function runSmartAnalysis({ autoColor = false } = {}) {
      if (state.smartFiles.length === 0) return;
      const reqSeq = ++state.analyzeSeq;
      state.analyzing = true;
      renderSmartImport();
      showToast('');

      try {
        const res = await api('/api/packs/analyze-import', {
          method: 'POST',
          body: JSON.stringify({
            layout: 'auto',
            files: state.smartFiles.map((f) => {
              const manual = f.roleHint && f.roleHint !== 'auto' ? f.roleHint : '';
              return manual
                ? { name: f.name, dataUrl: f.dataUrl, roleHint: manual, manualRole: manual }
                : { name: f.name, dataUrl: f.dataUrl, roleHint: 'auto' };
            }),
            facets: { flipSide: state.smartFlipSide },
            flipSide: state.smartFlipSide,
          }),
        });
        if (reqSeq !== state.analyzeSeq) return;

        state.smartModeLabel = res.modeLabel || '';
        state.smartWarnings = Array.isArray(res.warnings) ? res.warnings : [];
        state.smartRoleCounts = res.roleCounts && typeof res.roleCounts === 'object' ? res.roleCounts : null;

        if (Array.isArray(res.items)) {
          if (state.smartFiles.length === 1 && res.mode === 'three-view' && state.smartFiles[0].roleHint === 'auto') {
            state.smartFiles[0].role = 'three-view';
            state.smartFiles[0].roleLabel = '三视图拆分';
            state.smartFiles[0].autoRoleLabel = '三视图拆分';
            state.smartFiles[0].previewDataUrl = '';
          } else {
            res.items.forEach((it, idx) => {
              const sf = state.smartFiles[idx];
              if (!sf) return;
              sf.role = it.role || sf.role;
              sf.roleLabel = it.roleLabel || ROLE_LABELS[sf.role] || sf.roleLabel;
              if (sf.roleHint === 'auto' && !it.isManual) {
                sf.autoRoleLabel = sf.roleLabel;
              }
              sf.reason = it.reason || '';
              sf.isPrimaryAnchor = Boolean(it.isPrimaryAnchor);
              if (it.previewDataUrl) {
                sf.previewDataUrl = it.previewDataUrl;
              }
            });
          }
        }
        state.smartViews = normalizeViewsArray(res.views);

        if (autoColor && !state.colorManuallyPicked && res.suggestedColor && /^#[0-9a-fA-F]{6}$/.test(res.suggestedColor)) {
          $('inpColor').value = res.suggestedColor;
          state.suggestedColorApplied = true;
        }
      } catch (err) {
        if (reqSeq !== state.analyzeSeq) return;
        showToast(err, 'err');
      } finally {
        if (reqSeq === state.analyzeSeq) {
          state.analyzing = false;
          renderSmartImport();
        }
      }
    }

    async function runFacetedAnalysis({ autoColor = false } = {}) {
      if (countFacetFiles() === 0) return;
      const reqSeq = ++state.analyzeSeq;
      try {
        const res = await api('/api/packs/analyze-import', {
          method: 'POST',
          body: JSON.stringify({
            layout: 'faceted',
            facets: buildFacetsPayload(),
          }),
        });
        if (reqSeq !== state.analyzeSeq) return;
        state.facetedWarnings = Array.isArray(res.warnings) ? res.warnings : [];
        renderWarningsBar($('facetedWarnings'), state.facetedWarnings);
        if (autoColor && !state.colorManuallyPicked && res.suggestedColor && /^#[0-9a-fA-F]{6}$/.test(res.suggestedColor)) {
          $('inpColor').value = res.suggestedColor;
          state.suggestedColorApplied = true;
        }
      } catch (err) {
        if (reqSeq !== state.analyzeSeq) return;
        showToast(err, 'err');
      }
    }

    async function handleSmartIncomingFiles(fileList) {
      const rawFiles = Array.from(fileList || []).filter(Boolean);
      if (rawFiles.length === 0) return;
      showToast('');

      const remaining = 16 - state.smartFiles.length;
      if (remaining <= 0) {
        showToast('一次最多导入 16 张图片，请先移除不需要的图片再继续添加。', 'err');
        return;
      }

      const slice = rawFiles.slice(0, remaining);
      const createBtn = $('btnCreate');
      const prevBtnDisabled = createBtn.disabled;
      createBtn.disabled = true;
      $('smartDropLabel').textContent = `正在读取 ${slice.length} 张图片…`;
      try {
        const prepared = [];
        for (const f of slice) {
          prepared.push(await prepareImageFile(f));
        }
        const hadColor = state.colorManuallyPicked || state.suggestedColorApplied;
        for (const p of prepared) {
          state.smartFiles.push({
            name: p.name,
            dataUrl: p.dataUrl,
            roleHint: 'auto',
            role: '',
            roleLabel: '',
            autoRoleLabel: '',
            reason: '',
            isPrimaryAnchor: false,
            previewDataUrl: '',
          });
        }
        renderSmartImport();
        await runSmartAnalysis({ autoColor: !hadColor });
        if (rawFiles.length > remaining) {
          showToast('一次最多导入 16 张图片，已保留前 16 张。', 'err');
        }
      } catch (err) {
        renderSmartImport();
        showToast(err, 'err');
      } finally {
        createBtn.disabled = prevBtnDisabled;
      }
    }

    async function handleFacetIncomingFiles(slotKey, fileList) {
      const rawFiles = Array.from(fileList || []).filter(Boolean);
      if (rawFiles.length === 0) return;
      const targetSlot = FACET_SLOTS.some((s) => s.key === slotKey) ? slotKey : 'action';
      showToast('');
      try {
        const remaining = 16 - countFacetFiles();
        if (remaining <= 0) {
          showToast('一次最多导入 16 张图片，请先移除部分图片再继续添加。', 'err');
          return;
        }
        const hadColor = state.colorManuallyPicked || state.suggestedColorApplied;
        for (const f of rawFiles.slice(0, remaining)) {
          const p = await prepareImageFile(f);
          state.facets[targetSlot].push(p);
        }
        renderFacetedUpload();
        await runFacetedAnalysis({ autoColor: !hadColor });
        if (rawFiles.length > remaining) {
          showToast('一次最多导入 16 张图片，已保留前 16 张。', 'err');
        }
      } catch (err) {
        showToast(err, 'err');
      }
    }

    function withCacheBust(url, nonce) {
      const s = String(url || '').trim();
      if (!s || s.startsWith('data:') || s.startsWith('blob:')) return s;
      const sep = s.includes('?') ? '&' : '?';
      return `${s}${sep}t=${nonce || state.bench.assetNonce || Date.now()}`;
    }

    function isAtlasCellEmpty(img, col, row, fw, fh) {
      if (!img || !img.complete || img.naturalWidth === 0) return false;
      try {
        if (!cellAlphaCanvas) {
          cellAlphaCanvas = document.createElement('canvas');
          cellAlphaCtx = cellAlphaCanvas.getContext('2d', { willReadFrequently: true });
        }
        const sw = Math.max(1, Math.min(64, fw));
        const sh = Math.max(1, Math.min(64, fh));
        if (cellAlphaCanvas.width !== sw || cellAlphaCanvas.height !== sh) {
          cellAlphaCanvas.width = sw;
          cellAlphaCanvas.height = sh;
        }
        cellAlphaCtx.clearRect(0, 0, sw, sh);
        cellAlphaCtx.drawImage(img, col * fw, row * fh, fw, fh, 0, 0, sw, sh);
        const data = cellAlphaCtx.getImageData(0, 0, sw, sh).data;
        for (let i = 3; i < data.length; i += 8) {
          if (data[i] > 10) return false;
        }
        return true;
      } catch {
        return false;
      }
    }

    function showBenchToast(msg, kind = 'ok') {
      const el = $('benchToast');
      el.innerHTML = '';
      if (!msg) {
        el.className = 'notice-bar hidden';
        return;
      }
      el.className = 'notice-bar ' + (kind === 'err' ? 'is-err' : 'is-ok');
      el.appendChild(createNoticeIcon(kind === 'err' ? 'err' : 'ok'));
      const span = document.createElement('span');
      span.textContent = kind === 'err' ? humanizeError(msg) : msg;
      el.appendChild(span);
    }

    function getSpriteCharacterList() {
      const out = [];
      for (const p of state.packs) {
        if (p.isBuiltin) continue;
        for (const v of p.variants || []) {
          out.push({
            key: `${p.id}::${v.id}`,
            packId: p.id,
            packName: p.name || p.id,
            variantId: v.id,
            variantName: v.name || v.id,
            assetUrl: v.assetUrl || '',
            thumbUrl: v.thumbUrl || '',
          });
        }
      }
      return out;
    }

    function getRowKey(rSpec) {
      if (!rSpec) return 'R00';
      return String(rSpec.code || rSpec.id || `R${String(rSpec.row ?? 0).padStart(2, '0')}`);
    }

    function getRowColStart(rSpec) {
      return Math.max(0, Number(rSpec?.colStart) || 0);
    }

    function getRowActiveCols(rSpec) {
      return Math.max(1, Number(rSpec?.activeCols) || state.bench.variant?.cols || 1);
    }

    function getRowSpecByKey(rowKey) {
      const specs = state.bench.rowSpecs || [];
      return specs.find((r) => getRowKey(r) === rowKey) || specs[0] || {
        id: 'R00',
        code: 'R00',
        title: '待机',
        row: 0,
        colStart: 0,
        activeCols: state.bench.variant?.cols || 1,
        frameMs: 180,
      };
    }

    function getSelectedStaticSpec() {
      return (state.bench.staticSpecs || []).find((s) => s.key === state.bench.selectedStaticKey) || null;
    }

    function getBenchRowState(rowKey) {
      const rSpec = getRowSpecByKey(rowKey);
      const key = getRowKey(rSpec);
      const activeN = getRowActiveCols(rSpec);
      if (!state.bench.rowStates[key]) {
        state.bench.rowStates[key] = {
          playing: activeN > 1,
          col: 0,
          lastAdvanceAt: performance.now(),
        };
      }
      const rs = state.bench.rowStates[key];
      rs.col = ((Number(rs.col) || 0) % activeN + activeN) % activeN;
      return rs;
    }

    function initBenchRowStates({ keepSelection = false } = {}) {
      const now = performance.now();
      const prevStates = keepSelection ? state.bench.rowStates : {};
      const nextStates = {};
      for (const rSpec of state.bench.rowSpecs) {
        const key = getRowKey(rSpec);
        const activeN = getRowActiveCols(rSpec);
        const prev = prevStates[key];
        if (prev && keepSelection) {
          nextStates[key] = {
            playing: activeN > 1 ? Boolean(prev.playing) : false,
            col: ((Number(prev.col) || 0) % activeN + activeN) % activeN,
            lastAdvanceAt: now,
          };
        } else {
          nextStates[key] = {
            playing: activeN > 1,
            col: 0,
            lastAdvanceAt: now,
          };
        }
      }
      state.bench.rowStates = nextStates;
    }

    function setPlayButtonVisual(btn, playing, labelPrefix = '') {
      if (!btn) return;
      btn.innerHTML = '';
      btn.appendChild(createTransportIcon(playing ? 'pause' : 'play', 12));
      const actionLabel = playing ? '暂停' : '播放';
      btn.classList.toggle('is-playing', playing);
      btn.setAttribute('aria-pressed', String(playing));
      btn.setAttribute('aria-label', labelPrefix ? `${labelPrefix} ${actionLabel}` : actionLabel);
      btn.title = labelPrefix ? `${labelPrefix} ${actionLabel}` : `${actionLabel} (空格)`;
    }

    function isBenchSectionVisible() {
      const sec = $('frameBenchSection');
      if (!sec) return false;
      return !sec.classList.contains('hidden') && !sec.classList.contains('is-tab-hidden') && !sec.classList.contains('is-sec-collapsed');
    }

    function applySectionCollapseUI() {
      const map = {
        packs: 'packsSection',
        settings: 'settingsSection',
        create: 'createSection',
        bench: 'frameBenchSection',
      };
      for (const [key, id] of Object.entries(map)) {
        const sec = $(id);
        if (!sec) continue;
        const collapsed = state.workshopTab === 'all' ? Boolean(state.collapsedSections[key]) : false;
        sec.classList.toggle('is-sec-collapsed', collapsed);
        const btn = sec.querySelector(`[data-sec-toggle="${key}"]`);
        if (btn) {
          btn.setAttribute('aria-expanded', String(!collapsed));
        }
      }
      syncPacksCollapseActionsUI();
      if (isBenchSectionVisible()) {
        startBenchLoop();
      } else {
        stopBenchLoop();
      }
    }

    function applyWorkshopTabUI() {
      const tab = VALID_WORKSHOP_TABS.has(state.workshopTab) ? state.workshopTab : 'all';
      state.workshopTab = tab;
      document.querySelectorAll('[data-workshop-tab]').forEach((btn) => {
        const active = btn.dataset.workshopTab === tab;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-selected', String(active));
      });

      const listLen = getSpriteCharacterList().length;
      const benchSec = $('frameBenchSection');
      const benchEmpty = $('benchEmptyNotice');
      const benchMod = $('benchModule');
      if (benchSec) {
        if (listLen === 0) {
          if (tab === 'bench') {
            benchSec.classList.remove('hidden');
            if (benchEmpty) benchEmpty.classList.remove('hidden');
            if (benchMod) benchMod.classList.add('hidden');
          } else {
            benchSec.classList.add('hidden');
            if (benchEmpty) benchEmpty.classList.add('hidden');
            if (benchMod) benchMod.classList.remove('hidden');
          }
        } else {
          benchSec.classList.remove('hidden');
          if (benchEmpty) benchEmpty.classList.add('hidden');
          if (benchMod) benchMod.classList.remove('hidden');
        }
      }

      const secMap = {
        packs: $('packsSection'),
        settings: $('settingsSection'),
        create: $('createSection'),
        bench: $('frameBenchSection'),
      };
      for (const [key, sec] of Object.entries(secMap)) {
        if (!sec) continue;
        sec.classList.toggle('is-tab-hidden', tab !== 'all' && tab !== key);
      }

      applySectionCollapseUI();
    }

    function setWorkshopTab(nextTab, { scrollTop = true } = {}) {
      const tab = VALID_WORKSHOP_TABS.has(nextTab) ? nextTab : 'all';
      state.workshopTab = tab;
      try {
        localStorage.setItem(STORAGE_KEYS.tab, tab);
      } catch {}
      if (tab !== 'all' && state.collapsedSections[tab]) {
        delete state.collapsedSections[tab];
        saveJsonStorage(STORAGE_KEYS.sections, state.collapsedSections);
      }
      applyWorkshopTabUI();
      if (scrollTop) {
        window.scrollTo({ top: 0, behavior: 'auto' });
      }
    }

    function toggleSectionCollapse(secKey) {
      if (!secKey) return;
      if (state.workshopTab !== 'all' && state.workshopTab === secKey) {
        setWorkshopTab('all', { scrollTop: false });
        state.collapsedSections[secKey] = true;
        saveJsonStorage(STORAGE_KEYS.sections, state.collapsedSections);
        applySectionCollapseUI();
        return;
      }
      state.collapsedSections[secKey] = !state.collapsedSections[secKey];
      if (!state.collapsedSections[secKey]) {
        delete state.collapsedSections[secKey];
      }
      saveJsonStorage(STORAGE_KEYS.sections, state.collapsedSections);
      applySectionCollapseUI();
    }

    function hasAnyBenchCollapsed() {
      if (state.bench.staticSpecs.length > 0 && state.collapsedBench.static) {
        return true;
      }
      for (const rSpec of state.bench.rowSpecs) {
        if (state.collapsedBench[getRowKey(rSpec)]) return true;
      }
      return false;
    }

    function syncBenchCollapseUI() {
      const staticSec = $('benchStaticSection');
      const staticBtn = $('btnBenchStaticCollapse');
      const staticCollapsed = Boolean(state.collapsedBench.static);
      if (staticSec) {
        staticSec.classList.toggle('is-collapsed', staticCollapsed);
      }
      if (staticBtn) {
        staticBtn.setAttribute('aria-expanded', String(!staticCollapsed));
      }

      for (const rSpec of state.bench.rowSpecs) {
        const key = getRowKey(rSpec);
        const dom = benchRowDom[key];
        if (!dom) continue;
        const rowCollapsed = Boolean(state.collapsedBench[key]);
        dom.rowWrap.classList.toggle('is-collapsed', rowCollapsed);
        if (dom.collapseBtn) {
          dom.collapseBtn.setAttribute('aria-expanded', String(!rowCollapsed));
          dom.collapseBtn.title = rowCollapsed ? `展开 ${rSpec.code}` : `折叠 ${rSpec.code}`;
        }
        if (!rowCollapsed) {
          drawRowLiveCanvas(key);
        }
      }

      const toggleOthersBtn = $('btnBenchCollapseOthers');
      const toggleOthersLbl = $('benchCollapseOthersLabel');
      if (toggleOthersBtn && toggleOthersLbl) {
        const anyCollapsed = hasAnyBenchCollapsed();
        toggleOthersBtn.classList.toggle('is-on', anyCollapsed);
        toggleOthersBtn.setAttribute('aria-pressed', String(anyCollapsed));
        toggleOthersLbl.textContent = anyCollapsed ? '全部展开' : '折叠其他行';
      }
    }

    function toggleBenchCategoryCollapse(catKey) {
      if (!catKey) return;
      state.collapsedBench[catKey] = !state.collapsedBench[catKey];
      if (!state.collapsedBench[catKey]) {
        delete state.collapsedBench[catKey];
      }
      saveJsonStorage(STORAGE_KEYS.bench, state.collapsedBench);
      syncBenchCollapseUI();
    }

    function toggleBenchCollapseOthers() {
      if (hasAnyBenchCollapsed()) {
        state.collapsedBench = {};
      } else {
        const next = {};
        if (state.bench.selectionKind === 'static') {
          for (const rSpec of state.bench.rowSpecs) {
            next[getRowKey(rSpec)] = true;
          }
        } else {
          if (state.bench.staticSpecs.length > 0) {
            next.static = true;
          }
          const keepKey = state.bench.selectedRowKey;
          for (const rSpec of state.bench.rowSpecs) {
            const key = getRowKey(rSpec);
            if (key !== keepKey) {
              next[key] = true;
            }
          }
        }
        state.collapsedBench = next;
      }
      saveJsonStorage(STORAGE_KEYS.bench, state.collapsedBench);
      syncBenchCollapseUI();
    }

    function stopBenchLoop() {
      if (benchRafId) {
        cancelAnimationFrame(benchRafId);
        benchRafId = 0;
      }
    }

    function startBenchLoop() {
      if (benchRafId) return;
      if (!state.bench.atlasImg || !isBenchSectionVisible()) return;
      const anyPlaying = state.bench.rowSpecs.some((rSpec) => {
        const activeN = getRowActiveCols(rSpec);
        return activeN > 1 && getBenchRowState(getRowKey(rSpec)).playing;
      });
      if (!anyPlaying) return;
      benchRafId = requestAnimationFrame(tickBenchAnimations);
    }

    function tickBenchAnimations(now) {
      benchRafId = 0;
      if (!state.bench.atlasImg || !isBenchSectionVisible()) return;

      const speed = Math.max(0.25, Number(state.bench.speed) || 1);
      let anyPlaying = false;
      for (const rSpec of state.bench.rowSpecs) {
        const key = getRowKey(rSpec);
        const activeN = getRowActiveCols(rSpec);
        const rs = getBenchRowState(key);
        if (!rs.playing || activeN <= 1) continue;

        anyPlaying = true;
        const interval = Math.max(25, Math.round((Number(rSpec.frameMs) || 180) / speed));
        const elapsed = now - rs.lastAdvanceAt;
        if (elapsed >= interval) {
          rs.col = (rs.col + 1) % activeN;
          rs.lastAdvanceAt = elapsed > interval * 2 ? now : (now - (elapsed % interval));
          if (!state.collapsedBench[key]) {
            drawRowLiveCanvas(key);
          }
          if (state.bench.selectionKind === 'row' && key === state.bench.selectedRowKey) {
            drawBenchLiveFrame();
          }
        }
      }

      if (anyPlaying) {
        benchRafId = requestAnimationFrame(tickBenchAnimations);
      }
    }

    function syncBenchCharacterOptions() {
      const list = getSpriteCharacterList();
      if (list.length === 0) {
        applyWorkshopTabUI();
        stopBenchLoop();
        return;
      }
      applyWorkshopTabUI();

      const sel = $('benchCharSelect');
      const curKey = `${state.bench.packId}::${state.bench.variantId}`;
      sel.innerHTML = '';
      for (const item of list) {
        const opt = document.createElement('option');
        opt.value = item.key;
        opt.textContent = `${item.packName} · ${item.variantName}`;
        sel.appendChild(opt);
      }

      let target = list.find((x) => x.key === curKey);
      if (!target) {
        target = list.find((x) => x.packId === state.packId && x.variantId === state.scheme) || list[0];
        loadBenchCharacter(target.packId, target.variantId);
      } else {
        sel.value = target.key;
        if (state.bench.variant && target.assetUrl && target.assetUrl !== state.bench.variant.assetUrl) {
          loadBenchCharacter(target.packId, target.variantId, { keepSelection: true });
        }
      }
    }

    async function loadBenchCharacter(packId, variantId, { keepSelection = false } = {}) {
      if (!packId || packId === 'hachimi') return;
      const loadSeq = ++state.bench.loadSeq;
      state.bench.packId = packId;
      state.bench.variantId = variantId;
      const sel = $('benchCharSelect');
      const key = `${packId}::${variantId}`;
      if ([...sel.options].some((o) => o.value === key)) {
        sel.value = key;
      }

      try {
        const res = await api(`/api/packs/inspect-frames?packId=${encodeURIComponent(packId)}&variantId=${encodeURIComponent(variantId)}`);
        if (loadSeq !== state.bench.loadSeq) return;
        state.bench.variant = res.variant;
        state.bench.hasHoldCell = Boolean(res.hasHoldCell);
        state.bench.rowSpecs = Array.isArray(res.rowSpecs) ? res.rowSpecs : [];
        state.bench.staticSpecs = Array.isArray(res.staticSpecs) ? res.staticSpecs : [];
        state.bench.assetNonce = Date.now();
        if (!keepSelection) {
          state.bench.batchCells = [];
          state.bench.filterKey = 'all';
          state.bench.filterOnly = false;
          if (state.bench.rowSpecs.length > 0) {
            const firstRow = state.bench.rowSpecs[0];
            state.bench.selectionKind = 'row';
            state.bench.selectedRowKey = getRowKey(firstRow);
            state.bench.selectedRow = firstRow.row;
            state.bench.selectedCol = getRowColStart(firstRow);
            state.bench.scope = 'cell';
          } else if (state.bench.staticSpecs.length > 0) {
            const firstStatic = state.bench.staticSpecs[0];
            state.bench.selectionKind = 'static';
            state.bench.selectedStaticKey = firstStatic.key;
            state.bench.scope = firstStatic.scope || 'asset';
          }
        } else {
          if (state.bench.selectionKind === 'static') {
            const validStatic = state.bench.staticSpecs.some((s) => s.key === state.bench.selectedStaticKey);
            if (!validStatic) {
              if (state.bench.staticSpecs.length > 0) {
                state.bench.selectedStaticKey = state.bench.staticSpecs[0].key;
                state.bench.scope = state.bench.staticSpecs[0].scope || 'asset';
              } else if (state.bench.rowSpecs.length > 0) {
                state.bench.selectionKind = 'row';
              }
            }
          }
          if (state.bench.selectionKind === 'row') {
            const validRow = state.bench.rowSpecs.some((r) => getRowKey(r) === state.bench.selectedRowKey);
            if (!validRow && state.bench.rowSpecs.length > 0) {
              state.bench.selectedRowKey = getRowKey(state.bench.rowSpecs[0]);
            }
            if (state.bench.rowSpecs.length > 0) {
              const rSpec = getRowSpecByKey(state.bench.selectedRowKey);
              const colStart = getRowColStart(rSpec);
              const activeN = getRowActiveCols(rSpec);
              state.bench.selectedRow = rSpec.row;
              state.bench.selectedCol = Math.min(colStart + activeN - 1, Math.max(colStart, state.bench.selectedCol));
            } else if (state.bench.staticSpecs.length > 0) {
              state.bench.selectionKind = 'static';
              state.bench.selectedStaticKey = state.bench.staticSpecs[0].key;
              state.bench.scope = state.bench.staticSpecs[0].scope || 'asset';
            }
          }
        }
        initBenchRowStates({ keepSelection });

        const assetUrl = res.variant?.assetUrl || '';
        if (!assetUrl) {
          state.bench.atlasImg = null;
          stopBenchLoop();
          renderBenchUI();
          return;
        }

        const img = new Image();
        img.onload = () => {
          if (loadSeq !== state.bench.loadSeq) return;
          state.bench.atlasImg = img;
          stopBenchLoop();
          renderBenchUI();
          startBenchLoop();
        };
        img.onerror = () => {
          if (loadSeq !== state.bench.loadSeq) return;
          state.bench.atlasImg = null;
          stopBenchLoop();
          if (state.bench.staticSpecs.length > 0) {
            renderBenchUI();
          }
          showBenchToast('该角色的动作图集暂时无法加载，请点击刷新重试。', 'err');
        };
        img.src = withCacheBust(assetUrl, state.bench.assetNonce);
      } catch (err) {
        if (loadSeq !== state.bench.loadSeq) return;
        showBenchToast(err, 'err');
      }
    }

    function getBenchBgClass() {
      if (state.bench.bg === 'checker') return 'bench-bg-checker';
      if (state.bench.bg === 'light') return 'bench-bg-light';
      return 'bench-bg-dark';
    }

    function getCurrentBenchNoteKey() {
      const { packId, variantId, selectionKind, selectedRowKey, selectedCol, selectedStaticKey, scope } = state.bench;
      if (selectionKind === 'static') {
        return `${packId}:${variantId}:static:${selectedStaticKey}`;
      }
      return scope === 'row'
        ? `${packId}:${variantId}:row:${selectedRowKey}`
        : `${packId}:${variantId}:row:${selectedRowKey}:c${selectedCol}`;
    }

    function syncBenchBatchUI() {
      const modeBtn = $('btnBenchBatchMode');
      const pill = $('benchBatchPill');
      const countText = $('benchBatchCountText');
      modeBtn.classList.toggle('is-on', state.bench.batchMode);
      modeBtn.setAttribute('aria-pressed', String(state.bench.batchMode));
      const cnt = state.bench.batchCells.length;
      pill.classList.toggle('hidden', !state.bench.batchMode && cnt === 0);
      countText.textContent = `已选 ${cnt} 帧`;
    }

    function updateBenchTargetControls() {
      const isStatic = state.bench.selectionKind === 'static';
      const sSpec = isStatic ? getSelectedStaticSpec() : null;
      const rSpec = getRowSpecByKey(state.bench.selectedRowKey);
      const rowKey = getRowKey(rSpec);
      const colStart = getRowColStart(rSpec);
      const activeN = getRowActiveCols(rSpec);
      const rs = getBenchRowState(rowKey);
      const speed = Math.max(0.25, Number(state.bench.speed) || 1);

      if (isStatic && sSpec) {
        $('benchTargetLabel').textContent = `静态 · ${sSpec.code} ${sSpec.title}`;
        $('benchLiveRowLabel').textContent = `${sSpec.code} · ${sSpec.title}`;
        $('benchLiveFrameCount').textContent = sSpec.subtitle || '静态图';
        $('benchFpsReadout').textContent = '静态预览';
        setPlayButtonVisual($('btnBenchPlayToggle'), false);
        $('benchScopeSeg').classList.add('hidden');
      } else {
        const localCol = rs.playing
          ? (rs.col % activeN)
          : Math.max(0, Math.min(activeN - 1, state.bench.selectedCol - colStart));
        const actualCol = colStart + localCol;
        const colLabelSuffix = Array.isArray(rSpec.colLabels) && rSpec.colLabels[localCol] ? ` (${rSpec.colLabels[localCol]})` : '';
        const targetStr = state.bench.scope === 'row'
          ? `${rSpec.code} ${rSpec.title} · 整组动作`
          : `${rSpec.code} ${rSpec.title} · 第 c${state.bench.selectedCol} 帧${colLabelSuffix}`;
        $('benchTargetLabel').textContent = targetStr;
        $('benchLiveRowLabel').textContent = `${rSpec.code} · ${rSpec.title}`;
        $('benchLiveFrameCount').textContent = colStart > 0
          ? `c${actualCol} (${localCol + 1}/${activeN})`
          : `c${actualCol} / ${activeN}`;
        const interval = Math.max(25, Math.round((Number(rSpec.frameMs) || 180) / speed));
        $('benchFpsReadout').textContent = activeN > 1 ? `${(1000 / interval).toFixed(1)} fps` : '单帧';
        setPlayButtonVisual($('btnBenchPlayToggle'), rs.playing);
        $('benchScopeSeg').classList.toggle('hidden', state.bench.variant?.layout === 'single-image');
      }

      document.querySelectorAll('[data-bench-scope]').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.benchScope === state.bench.scope);
      });
      document.querySelectorAll('[data-bench-bg]').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.benchBg === state.bench.bg);
      });
      document.querySelectorAll('[data-bench-speed]').forEach((b) => {
        b.classList.toggle('is-active', Number(b.dataset.benchSpeed) === speed);
      });
      document.querySelectorAll('[data-bench-zoom-btn]').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.benchZoomBtn === state.bench.zoom);
      });
      $('benchModule').dataset.benchZoom = state.bench.zoom;
      $('benchModule').classList.toggle('is-expanded', state.bench.expanded);
      $('btnBenchExpandToggle').setAttribute('aria-pressed', String(state.bench.expanded));
      $('iconBenchExpand').classList.toggle('hidden', state.bench.expanded);
      $('iconBenchCollapse').classList.toggle('hidden', !state.bench.expanded);
      $('benchExpandLabel').textContent = state.bench.expanded ? '收起高度' : '展开全高';

      const anyPlaying = state.bench.rowSpecs.some((r) => getRowActiveCols(r) > 1 && getBenchRowState(getRowKey(r)).playing);
      $('benchToggleAllPlayLabel').textContent = anyPlaying ? '全部暂停' : '全部播放';

      const filterBtn = $('btnBenchFilterToggle');
      filterBtn.classList.toggle('is-on', state.bench.filterOnly);
      filterBtn.setAttribute('aria-pressed', String(state.bench.filterOnly));

      const liveBox = $('benchLiveBox');
      liveBox.className = `bench-live-box ${getBenchBgClass()}`;

      const noteKey = getCurrentBenchNoteKey();
      $('inpBenchNote').value = state.bench.notes[noteKey]?.text || '';
      const noteCount = Object.keys(state.bench.notes).length;
      const copyBtn = $('btnCopyBenchNotes');
      copyBtn.classList.toggle('hidden', noteCount === 0);
      if (noteCount > 0) {
        copyBtn.textContent = `复制修改清单 (${noteCount})`;
      }

      syncBenchBatchUI();

      const busy = state.bench.busy;
      const hasRows = state.bench.rowSpecs.length > 0;
      const canReplace = !isStatic || (sSpec && sSpec.replaceable !== false);
      const canTransform = !isStatic || (sSpec && sSpec.transformable !== false);
      const canAiRedraw = !isStatic && hasRows && state.bench.variant?.layout === 'codex-v2-8x11';
      $('btnBenchPrevFrame').disabled = busy || !hasRows;
      $('btnBenchNextFrame').disabled = busy || !hasRows;
      $('btnBenchPlayToggle').disabled = busy || !hasRows;
      $('btnBenchToggleAllPlay').disabled = busy || !hasRows;
      $('btnBenchCollapseOthers').disabled = busy || (!hasRows && state.bench.staticSpecs.length === 0);
      $('btnBenchUploadOne').disabled = busy || !canReplace;
      $('btnBenchFlipX').disabled = busy || !canTransform;
      $('btnBenchCleanEdge').disabled = busy || !canTransform;
      $('btnBenchAiRedraw').disabled = busy || !canAiRedraw;
      document.querySelectorAll('[data-bench-nudge]').forEach((b) => { b.disabled = busy || !canTransform; });
      syncBenchCollapseUI();
    }

    function drawBenchLiveFrame() {
      const canvas = $('benchLiveCanvas');
      const imgEl = $('benchLiveImg');
      const counterEl = $('benchLiveFrameCount');

      if (state.bench.selectionKind === 'static') {
        const sSpec = getSelectedStaticSpec();
        if (sSpec && (sSpec.kind === 'thumb' || sSpec.kind === 'image') && sSpec.imageUrl) {
          canvas.classList.add('hidden');
          imgEl.classList.remove('hidden');
          imgEl.src = withCacheBust(sSpec.imageUrl, state.bench.assetNonce);
          imgEl.alt = sSpec.title || sSpec.code || '';
          if (counterEl) counterEl.textContent = sSpec.subtitle || '静态';
          return;
        }
        imgEl.classList.add('hidden');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        const img = state.bench.atlasImg;
        const v = state.bench.variant;
        if (!ctx || !img || !v || !sSpec) return;
        const fw = v.frameWidth || 192;
        const fh = v.frameHeight || 208;
        if (canvas.width !== fw || canvas.height !== fh) {
          canvas.width = fw;
          canvas.height = fh;
        }
        ctx.clearRect(0, 0, fw, fh);
        ctx.drawImage(img, (sSpec.col || 0) * fw, (sSpec.row || 0) * fh, fw, fh, 0, 0, fw, fh);
        if (counterEl) counterEl.textContent = sSpec.subtitle || `r${sSpec.row || 0} c${sSpec.col || 0}`;
        return;
      }

      const v = state.bench.variant;
      if (v?.layout === 'single-image' && v.assetUrl) {
        canvas.classList.add('hidden');
        imgEl.classList.remove('hidden');
        imgEl.src = withCacheBust(v.assetUrl, state.bench.assetNonce);
        imgEl.alt = v.name || v.id || '';
        if (counterEl) counterEl.textContent = '1 / 1';
        return;
      }

      imgEl.classList.add('hidden');
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');
      const img = state.bench.atlasImg;
      if (!ctx || !img || !v) return;

      const fw = v.frameWidth || 192;
      const fh = v.frameHeight || 208;
      if (canvas.width !== fw || canvas.height !== fh) {
        canvas.width = fw;
        canvas.height = fh;
      }
      ctx.clearRect(0, 0, fw, fh);
      const rSpec = getRowSpecByKey(state.bench.selectedRowKey);
      const key = getRowKey(rSpec);
      const colStart = getRowColStart(rSpec);
      const activeN = getRowActiveCols(rSpec);
      const rs = getBenchRowState(key);
      const localCol = rs.playing
        ? (rs.col % activeN)
        : (state.bench.scope === 'cell' ? Math.max(0, Math.min(activeN - 1, state.bench.selectedCol - colStart)) : (rs.col % activeN));
      const actualCol = colStart + localCol;
      ctx.drawImage(img, actualCol * fw, rSpec.row * fh, fw, fh, 0, 0, fw, fh);

      if (counterEl) {
        counterEl.textContent = colStart > 0
          ? `c${actualCol} (${localCol + 1}/${activeN})`
          : `c${actualCol} / ${activeN}`;
      }
    }

    function drawRowLiveCanvas(rowKey) {
      const dom = benchRowDom[rowKey];
      const img = state.bench.atlasImg;
      const v = state.bench.variant;
      if (!dom || !img || !v) return;

      const rSpec = getRowSpecByKey(rowKey);
      const colStart = getRowColStart(rSpec);
      const activeN = getRowActiveCols(rSpec);
      const rs = getBenchRowState(rowKey);
      const localCol = rs.col % activeN;
      const actualCol = colStart + localCol;

      const fw = v.frameWidth || 192;
      const fh = v.frameHeight || 208;
      const ctx = dom.liveCtx;
      if (ctx) {
        ctx.clearRect(0, 0, fw, fh);
        if (v.layout === 'single-image') {
          const nw = img.naturalWidth || fw;
          const nh = img.naturalHeight || fh;
          const sc = Math.min(fw / Math.max(1, nw), fh / Math.max(1, nh));
          const dw = Math.max(1, Math.round(nw * sc));
          const dh = Math.max(1, Math.round(nh * sc));
          ctx.drawImage(img, 0, 0, nw, nh, Math.round((fw - dw) / 2), Math.round((fh - dh) / 2), dw, dh);
        } else {
          ctx.drawImage(img, actualCol * fw, rSpec.row * fh, fw, fh, 0, 0, fw, fh);
        }
      }
      if (dom.counterEl) {
        dom.counterEl.textContent = colStart > 0
          ? `c${actualCol} (${localCol + 1}/${activeN})`
          : `c${actualCol} / ${activeN}`;
      }
    }

    function applyBenchFilterVisibility() {
      const filterKey = state.bench.filterKey || 'all';
      const filterOnly = Boolean(state.bench.filterOnly) && filterKey !== 'all';
      const staticSec = $('benchStaticSection');
      if (staticSec && state.bench.staticSpecs.length > 0) {
        staticSec.classList.toggle('hidden', filterOnly && filterKey !== 'static');
      }
      for (const rSpec of state.bench.rowSpecs) {
        const key = getRowKey(rSpec);
        const dom = benchRowDom[key];
        if (!dom) continue;
        dom.rowWrap.classList.toggle('hidden', filterOnly && filterKey !== key);
      }
      document.querySelectorAll('#benchJumpStrip [data-jump-key]').forEach((chip) => {
        chip.classList.toggle('is-active', chip.dataset.jumpKey === filterKey);
      });
    }

    function jumpToBenchKey(key) {
      state.bench.filterKey = key || 'all';
      applyBenchFilterVisibility();
      updateBenchTargetControls();

      const scrollContainer = $('benchScrollBody');
      if (key === 'all') {
        if (state.bench.expanded) {
          $('benchModule').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
        }
        return;
      }

      const targetEl = key === 'static' ? $('benchStaticSection') : benchRowDom[key]?.rowWrap;
      if (!targetEl) return;
      if (state.collapsedBench[key]) {
        delete state.collapsedBench[key];
        saveJsonStorage(STORAGE_KEYS.bench, state.collapsedBench);
        syncBenchCollapseUI();
      }
      if (key !== 'static') {
        const rSpec = getRowSpecByKey(key);
        state.bench.selectionKind = 'row';
        state.bench.selectedRowKey = key;
        state.bench.selectedRow = rSpec.row;
        state.bench.selectedCol = getRowColStart(rSpec);
        syncBenchActiveStateUI();
      } else if (state.bench.staticSpecs.length > 0) {
        selectStaticSpec(state.bench.staticSpecs[0].key);
      }

      if (state.bench.expanded) {
        const top = targetEl.getBoundingClientRect().top + window.scrollY - ($('benchStickyDock').offsetHeight + 62);
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      } else {
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      targetEl.classList.add('is-jump-flash');
      setTimeout(() => targetEl.classList.remove('is-jump-flash'), 900);
    }

    function renderJumpStrip() {
      const strip = $('benchJumpStrip');
      if (!strip) return;
      strip.innerHTML = '';

      const mkChip = (key, label, extraCls = '') => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'jump-chip' + (state.bench.filterKey === key ? ' is-active' : '') + (extraCls ? ` ${extraCls}` : '');
        b.dataset.jumpKey = key;
        b.textContent = label;
        b.onclick = () => jumpToBenchKey(key);
        return b;
      };

      strip.appendChild(mkChip('all', '全部'));
      if (state.bench.staticSpecs.length > 0) {
        strip.appendChild(mkChip('static', '静态'));
      }
      for (const rSpec of state.bench.rowSpecs) {
        const key = getRowKey(rSpec);
        const isHold = rSpec.kind === 'hold' || key === 'R04H';
        strip.appendChild(mkChip(key, rSpec.code || key, isHold ? 'is-hold-chip' : ''));
      }
    }

    function selectStaticSpec(staticKey) {
      const spec = (state.bench.staticSpecs || []).find((s) => s.key === staticKey);
      if (!spec) return;
      state.bench.selectionKind = 'static';
      state.bench.selectedStaticKey = spec.key;
      state.bench.scope = spec.scope || 'cell';
      if (typeof spec.row === 'number') state.bench.selectedRow = spec.row;
      if (typeof spec.col === 'number') state.bench.selectedCol = spec.col;
      syncBenchActiveStateUI();
    }

    function toggleBatchCell(rowKey, row, col, code) {
      const idx = state.bench.batchCells.findIndex((x) => x.rowKey === rowKey && x.col === col);
      if (idx >= 0) {
        state.bench.batchCells.splice(idx, 1);
      } else {
        state.bench.batchCells.push({ rowKey, row, col, code });
      }
      syncBenchActiveStateUI();
    }

    function syncBenchActiveStateUI() {
      const isStaticMode = state.bench.selectionKind === 'static';
      for (const sSpec of state.bench.staticSpecs || []) {
        const card = benchStaticDom[sSpec.key];
        if (!card) continue;
        const staticNoteKey = `${state.bench.packId}:${state.bench.variantId}:static:${sSpec.key}`;
        card.classList.toggle('is-static-selected', isStaticMode && state.bench.selectedStaticKey === sSpec.key);
        card.classList.toggle('has-issue', Boolean(state.bench.notes[staticNoteKey]));
      }

      for (const rSpec of state.bench.rowSpecs) {
        const rowKey = getRowKey(rSpec);
        const dom = benchRowDom[rowKey];
        if (!dom) continue;
        const isRowSel = !isStaticMode && state.bench.selectedRowKey === rowKey;
        const colStart = getRowColStart(rSpec);
        const rs = getBenchRowState(rowKey);

        dom.rowWrap.classList.toggle('is-row-selected', isRowSel);
        setPlayButtonVisual(dom.playBtn, rs.playing, rSpec.code);
        drawRowLiveCanvas(rowKey);

        dom.cellBtns.forEach((cellBtn, localIdx) => {
          const actualCol = colStart + localIdx;
          const isCellSel = isRowSel && state.bench.scope === 'cell' && state.bench.selectedCol === actualCol;
          const isPausedMarker = !rs.playing && !isCellSel && rs.col === localIdx;
          const isBatchSel = state.bench.batchCells.some((x) => x.rowKey === rowKey && x.col === actualCol);
          const cellNoteKey = `${state.bench.packId}:${state.bench.variantId}:row:${rowKey}:c${actualCol}`;
          const rowNoteKey = `${state.bench.packId}:${state.bench.variantId}:row:${rowKey}`;
          const hasIssue = Boolean(state.bench.notes[cellNoteKey] || state.bench.notes[rowNoteKey]);

          cellBtn.classList.toggle('is-cell-selected', isCellSel);
          cellBtn.classList.toggle('is-row-paused-at', isPausedMarker);
          cellBtn.classList.toggle('is-batch-selected', isBatchSel);
          cellBtn.classList.toggle('has-issue', hasIssue);
          const chk = cellBtn.querySelector('.bench-cell-check');
          if (chk) chk.classList.toggle('hidden', !isBatchSel);
        });
      }
      updateBenchTargetControls();
      drawBenchLiveFrame();
    }

    function syncBenchBgClasses() {
      const bgCls = getBenchBgClass();
      const swapBg = (el) => {
        if (!el) return;
        el.classList.remove('bench-bg-dark', 'bench-bg-checker', 'bench-bg-light');
        el.classList.add(bgCls);
      };
      swapBg($('benchLiveBox'));
      Object.values(benchStaticDom).forEach((card) => {
        swapBg(card.querySelector('.bench-static-preview'));
      });
      for (const rSpec of state.bench.rowSpecs) {
        const dom = benchRowDom[getRowKey(rSpec)];
        if (!dom) continue;
        swapBg(dom.liveBox);
        dom.cellBtns.forEach(swapBg);
      }
      document.querySelectorAll('[data-bench-bg]').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.benchBg === state.bench.bg);
      });
    }

    function stepBenchRow(rowKey, delta) {
      if (!state.bench.atlasImg || state.bench.rowSpecs.length === 0) return;
      const rSpec = getRowSpecByKey(rowKey);
      const key = getRowKey(rSpec);
      const colStart = getRowColStart(rSpec);
      const activeN = getRowActiveCols(rSpec);
      const rs = getBenchRowState(key);
      rs.playing = false;
      rs.col = ((rs.col % activeN) + delta + activeN) % activeN;
      rs.lastAdvanceAt = performance.now();

      state.bench.selectionKind = 'row';
      state.bench.selectedRowKey = key;
      state.bench.selectedRow = rSpec.row;
      state.bench.selectedCol = colStart + rs.col;
      state.bench.scope = 'cell';

      syncBenchActiveStateUI();
      startBenchLoop();
    }

    function toggleBenchRowPlay(rowKey) {
      if (!state.bench.atlasImg || state.bench.rowSpecs.length === 0) return;
      const rSpec = getRowSpecByKey(rowKey);
      const key = getRowKey(rSpec);
      const colStart = getRowColStart(rSpec);
      const activeN = getRowActiveCols(rSpec);
      const rs = getBenchRowState(key);

      state.bench.selectionKind = 'row';
      state.bench.selectedRowKey = key;
      state.bench.selectedRow = rSpec.row;
      if (activeN <= 1) {
        rs.playing = false;
        state.bench.selectedCol = colStart;
        state.bench.scope = 'cell';
        syncBenchActiveStateUI();
        return;
      }

      rs.playing = !rs.playing;
      rs.lastAdvanceAt = performance.now();
      if (!rs.playing) {
        state.bench.selectedCol = colStart + (rs.col % activeN);
        state.bench.scope = 'cell';
      }
      syncBenchActiveStateUI();
      if (rs.playing) {
        startBenchLoop();
      }
    }

    function renderStaticSpecsSection() {
      const sec = $('benchStaticSection');
      const grid = $('benchStaticGrid');
      const countEl = $('benchStaticCount');
      benchStaticDom = {};
      grid.innerHTML = '';

      const specs = Array.isArray(state.bench.staticSpecs) ? state.bench.staticSpecs : [];
      if (specs.length === 0) {
        sec.classList.add('hidden');
        return;
      }
      sec.classList.remove('hidden');
      countEl.textContent = `${specs.length} 项`;

      const bgCls = getBenchBgClass();
      const img = state.bench.atlasImg;
      const v = state.bench.variant || {};
      const fw = v.frameWidth || 192;
      const fh = v.frameHeight || 208;

      for (const spec of specs) {
        const isSel = state.bench.selectionKind === 'static' && state.bench.selectedStaticKey === spec.key;
        const card = document.createElement('div');
        card.className = 'bench-static-card' + (isSel ? ' is-static-selected' : '');
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${spec.code} ${spec.title}`);
        card.onclick = () => selectStaticSpec(spec.key);
        card.onkeydown = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectStaticSpec(spec.key);
          }
        };

        const preview = document.createElement('div');
        preview.className = `bench-static-preview ${bgCls}`;

        let isCellBlank = Boolean(spec.empty);
        if ((spec.kind === 'thumb' || spec.kind === 'image') && spec.imageUrl) {
          const pImg = document.createElement('img');
          pImg.src = withCacheBust(spec.imageUrl, state.bench.assetNonce);
          pImg.alt = spec.title || spec.code;
          pImg.loading = 'lazy';
          preview.appendChild(pImg);
        } else if (img) {
          const cv = document.createElement('canvas');
          cv.width = fw;
          cv.height = fh;
          const ctx = cv.getContext('2d');
          const r = Number(spec.row) || 0;
          const c = Number(spec.col) || 0;
          if (ctx) {
            ctx.drawImage(img, c * fw, r * fh, fw, fh, 0, 0, fw, fh);
            isCellBlank = isCellBlank || isAtlasCellEmpty(img, c, r, fw, fh);
          }
          preview.appendChild(cv);
        }

        const codeBadge = document.createElement('span');
        codeBadge.className = 'bench-static-code';
        codeBadge.textContent = spec.code || spec.key;
        preview.appendChild(codeBadge);

        if (isCellBlank) {
          const emptyBadge = document.createElement('span');
          emptyBadge.className = 'bench-static-empty-pill';
          emptyBadge.textContent = '待补充';
          preview.appendChild(emptyBadge);
        }

        if (spec.replaceable !== false) {
          const repBtn = document.createElement('button');
          repBtn.type = 'button';
          repBtn.className = 'bench-static-replace-btn';
          repBtn.title = `上传替换 ${spec.title || spec.code}`;
          repBtn.setAttribute('aria-label', `上传替换 ${spec.title || spec.code}`);
          repBtn.appendChild(createUploadIcon(12));
          repBtn.onclick = (ev) => {
            ev.stopPropagation();
            selectStaticSpec(spec.key);
            $('inpBenchSingle').click();
          };
          preview.appendChild(repBtn);
        }

        const meta = document.createElement('div');
        meta.className = 'bench-static-meta';
        const nm = document.createElement('div');
        nm.className = 'bench-static-name';
        nm.textContent = spec.title || spec.code;
        const sub = document.createElement('div');
        sub.className = 'bench-static-sub';
        sub.textContent = spec.subtitle || (spec.kind === 'cell' ? `R${String(spec.row || 0).padStart(2, '0')} · c${spec.col || 0}` : '静态图像');
        meta.appendChild(nm);
        meta.appendChild(sub);

        card.appendChild(preview);
        card.appendChild(meta);
        grid.appendChild(card);
        benchStaticDom[spec.key] = card;
      }
    }

    function renderBenchUI() {
      renderJumpStrip();
      renderStaticSpecsSection();

      const listEl = $('benchRowsList');
      listEl.innerHTML = '';
      benchRowDom = {};
      const img = state.bench.atlasImg;
      const v = state.bench.variant;

      if (img && v) {
        const fw = v.frameWidth || 192;
        const fh = v.frameHeight || 208;
        const bgCls = getBenchBgClass();

        for (const rSpec of state.bench.rowSpecs) {
          const rowKey = getRowKey(rSpec);
          const colStart = getRowColStart(rSpec);
          const activeN = getRowActiveCols(rSpec);
          const rs = getBenchRowState(rowKey);
          const isRowSel = state.bench.selectionKind === 'row' && state.bench.selectedRowKey === rowKey;

          const isRowCollapsed = Boolean(state.collapsedBench[rowKey]);
          const rowWrap = document.createElement('div');
          rowWrap.className = 'bench-row-item bench-row-card' + (isRowSel ? ' is-row-selected' : '') + (isRowCollapsed ? ' is-collapsed' : '');
          rowWrap.dataset.rowKey = rowKey;

          const head = document.createElement('div');
          head.className = 'bench-row-head';

          const headLeft = document.createElement('div');
          headLeft.className = 'bench-row-head-left';

          const collapseBtn = document.createElement('button');
          collapseBtn.type = 'button';
          collapseBtn.className = 'bench-cat-collapse-btn';
          collapseBtn.dataset.benchRowCollapse = rowKey;
          collapseBtn.setAttribute('aria-expanded', String(!isRowCollapsed));
          collapseBtn.setAttribute('aria-label', `${isRowCollapsed ? '展开' : '折叠'} ${rSpec.code}`);
          collapseBtn.title = isRowCollapsed ? `展开 ${rSpec.code}` : `折叠 ${rSpec.code}`;
          collapseBtn.appendChild(createChevronIcon(13));
          collapseBtn.onclick = (ev) => {
            ev.stopPropagation();
            toggleBenchCategoryCollapse(rowKey);
          };

          const rowBtn = document.createElement('button');
          rowBtn.type = 'button';
          rowBtn.className = 'bench-row-btn';
          rowBtn.textContent = `${rSpec.code} · ${rSpec.title}`;
          rowBtn.onclick = () => {
            if (state.collapsedBench[rowKey]) {
              delete state.collapsedBench[rowKey];
              saveJsonStorage(STORAGE_KEYS.bench, state.collapsedBench);
            }
            state.bench.selectionKind = 'row';
            state.bench.selectedRowKey = rowKey;
            state.bench.selectedRow = rSpec.row;
            state.bench.selectedCol = colStart;
            state.bench.scope = 'row';
            syncBenchActiveStateUI();
          };

          headLeft.appendChild(collapseBtn);
          headLeft.appendChild(rowBtn);

          const headRight = document.createElement('div');
          headRight.className = 'bench-row-head-right';
          const rowCountSpan = document.createElement('span');
          rowCountSpan.className = 'bench-row-count';
          rowCountSpan.textContent = colStart > 0
            ? `c${colStart}..c${colStart + activeN - 1} · ${activeN} 帧`
            : `${activeN} 帧`;
          headRight.appendChild(rowCountSpan);
          head.appendChild(headLeft);
          head.appendChild(headRight);
          head.addEventListener('click', (ev) => {
            if (ev.target === head || ev.target === headRight || ev.target === rowCountSpan) {
              toggleBenchCategoryCollapse(rowKey);
            }
          });
          rowWrap.appendChild(head);

          const rowBody = document.createElement('div');
          rowBody.className = 'bench-row-body';

          // Column 0: Per-row real-time live animated preview + transport controls
          const liveCol = document.createElement('div');
          liveCol.className = 'bench-row-live-col';

          const liveBox = document.createElement('div');
          liveBox.className = `bench-row-live-box ${bgCls}`;
          liveBox.title = `聚焦 ${rSpec.code} ${rSpec.title}`;
          liveBox.onclick = () => {
            state.bench.selectionKind = 'row';
            state.bench.selectedRowKey = rowKey;
            state.bench.selectedRow = rSpec.row;
            if (!rs.playing) {
              state.bench.selectedCol = colStart + (rs.col % activeN);
              state.bench.scope = v.layout === 'single-image' ? 'asset' : 'cell';
            }
            syncBenchActiveStateUI();
          };

          let liveCtx = null;
          if (v.layout === 'single-image' && v.assetUrl) {
            const liveImg = document.createElement('img');
            liveImg.src = withCacheBust(v.assetUrl, state.bench.assetNonce);
            liveImg.alt = `${rSpec.code} ${rSpec.title}`;
            liveBox.appendChild(liveImg);
          } else {
            const liveCanvas = document.createElement('canvas');
            liveCanvas.width = fw;
            liveCanvas.height = fh;
            liveCtx = liveCanvas.getContext('2d');
            liveBox.appendChild(liveCanvas);
          }
          liveCol.appendChild(liveBox);

          const liveFoot = document.createElement('div');
          liveFoot.className = 'bench-row-live-foot';

          const counterEl = document.createElement('span');
          counterEl.className = 'bench-row-frame-counter';
          const initActualCol = colStart + (rs.col % activeN);
          counterEl.textContent = colStart > 0
            ? `c${initActualCol} (${(rs.col % activeN) + 1}/${activeN})`
            : `c${initActualCol} / ${activeN}`;
          liveFoot.appendChild(counterEl);

          const transport = document.createElement('div');
          transport.className = 'bench-transport';
          transport.setAttribute('role', 'group');
          transport.setAttribute('aria-label', `${rSpec.code} 播放控制`);

          const prevBtn = document.createElement('button');
          prevBtn.type = 'button';
          prevBtn.className = 'bench-transport-btn';
          prevBtn.dataset.benchAction = 'prev';
          prevBtn.title = `${rSpec.code} 上一帧`;
          prevBtn.setAttribute('aria-label', `${rSpec.code} 上一帧`);
          prevBtn.appendChild(createTransportIcon('prev', 12));
          prevBtn.onclick = () => stepBenchRow(rowKey, -1);

          const playBtn = document.createElement('button');
          playBtn.type = 'button';
          playBtn.className = 'bench-transport-btn';
          playBtn.dataset.benchAction = 'play';
          setPlayButtonVisual(playBtn, rs.playing, rSpec.code);
          playBtn.onclick = () => toggleBenchRowPlay(rowKey);

          const nextBtn = document.createElement('button');
          nextBtn.type = 'button';
          nextBtn.className = 'bench-transport-btn';
          nextBtn.dataset.benchAction = 'next';
          nextBtn.title = `${rSpec.code} 下一帧`;
          nextBtn.setAttribute('aria-label', `${rSpec.code} 下一帧`);
          nextBtn.appendChild(createTransportIcon('next', 12));
          nextBtn.onclick = () => stepBenchRow(rowKey, 1);

          transport.appendChild(prevBtn);
          transport.appendChild(playBtn);
          transport.appendChild(nextBtn);
          liveFoot.appendChild(transport);
          liveCol.appendChild(liveFoot);
          rowBody.appendChild(liveCol);

          // Selectable single frames (c0..cN-1 or c5..c7 for R04H)
          const track = document.createElement('div');
          track.className = 'bench-cells-track';
          const cellBtns = [];

          for (let localIdx = 0; localIdx < activeN; localIdx++) {
            const actualCol = colStart + localIdx;
            const cellBtn = document.createElement('button');
            cellBtn.type = 'button';
            const isCellSel = isRowSel && state.bench.scope === 'cell' && state.bench.selectedCol === actualCol;
            const isPausedMarker = !rs.playing && !isCellSel && rs.col === localIdx;
            const isBatchSel = state.bench.batchCells.some((x) => x.rowKey === rowKey && x.col === actualCol);
            const cellNoteKey = `${state.bench.packId}:${state.bench.variantId}:row:${rowKey}:c${actualCol}`;
            const rowNoteKey = `${state.bench.packId}:${state.bench.variantId}:row:${rowKey}`;
            const hasIssue = Boolean(state.bench.notes[cellNoteKey] || state.bench.notes[rowNoteKey]);

            let cellMediaEl = null;
            let isEmpty = false;
            if (v.layout === 'single-image' && v.assetUrl) {
              const pImg = document.createElement('img');
              pImg.src = withCacheBust(v.assetUrl, state.bench.assetNonce);
              pImg.alt = `${rSpec.code} ${rSpec.title}`;
              cellMediaEl = pImg;
            } else {
              const cv = document.createElement('canvas');
              cv.width = fw;
              cv.height = fh;
              const cctx = cv.getContext('2d');
              if (cctx) {
                cctx.drawImage(img, actualCol * fw, rSpec.row * fh, fw, fh, 0, 0, fw, fh);
                isEmpty = isAtlasCellEmpty(img, actualCol, rSpec.row, fw, fh);
              }
              cellMediaEl = cv;
            }

            cellBtn.className = `bench-cell-btn ${bgCls}${isCellSel ? ' is-cell-selected' : ''}${isPausedMarker ? ' is-row-paused-at' : ''}${isBatchSel ? ' is-batch-selected' : ''}${isEmpty ? ' is-cell-empty' : ''}${hasIssue ? ' has-issue' : ''}`;

            const chkBadge = document.createElement('span');
            chkBadge.className = 'bench-cell-check' + (isBatchSel ? '' : ' hidden');
            chkBadge.appendChild(createCheckIcon(10));
            cellBtn.appendChild(chkBadge);

            const colHint = Array.isArray(rSpec.colLabels) && rSpec.colLabels[localIdx] ? rSpec.colLabels[localIdx] : '';
            if (colHint) {
              cellBtn.title = `c${actualCol} · ${colHint}${isEmpty ? '（待补充）' : ''}`;
            } else if (isEmpty) {
              cellBtn.title = `c${actualCol}（当前为空白帧，可点击上传补充）`;
            }

            const idxSpan = document.createElement('span');
            idxSpan.className = 'bench-cell-idx';
            idxSpan.textContent = v.layout === 'single-image'
              ? '主图'
              : (colHint ? `c${actualCol} ${colHint}` : (isEmpty ? `c${actualCol} 空` : `c${actualCol}`));

            cellBtn.appendChild(cellMediaEl);
            cellBtn.appendChild(idxSpan);
            cellBtn.onclick = (ev) => {
              if (state.bench.batchMode || ev.shiftKey) {
                if (!state.bench.batchMode) state.bench.batchMode = true;
                toggleBatchCell(rowKey, rSpec.row, actualCol, rSpec.code);
                return;
              }
              state.bench.selectionKind = 'row';
              state.bench.selectedRowKey = rowKey;
              state.bench.selectedRow = rSpec.row;
              state.bench.selectedCol = actualCol;
              state.bench.scope = v.layout === 'single-image' ? 'asset' : 'cell';
              const rowState = getBenchRowState(rowKey);
              rowState.col = localIdx;
              rowState.lastAdvanceAt = performance.now();
              syncBenchActiveStateUI();
            };
            track.appendChild(cellBtn);
            cellBtns.push(cellBtn);
          }

          rowBody.appendChild(track);
          rowWrap.appendChild(rowBody);
          listEl.appendChild(rowWrap);

          benchRowDom[rowKey] = {
            rowWrap,
            collapseBtn,
            rowBtn,
            liveBox,
            liveCtx,
            counterEl,
            playBtn,
            cellBtns,
          };
          if (!isRowCollapsed) {
            drawRowLiveCanvas(rowKey);
          }
        }
      }

      syncBenchCollapseUI();
      applyBenchFilterVisibility();
      updateBenchTargetControls();
      drawBenchLiveFrame();
    }

    async function runBenchEdit(payload, successMsg) {
      if (!state.bench.packId || !state.bench.variantId) return;
      state.bench.busy = true;
      updateBenchTargetControls();
      showBenchToast('');
      try {
        const isStatic = state.bench.selectionKind === 'static';
        const sSpec = isStatic ? getSelectedStaticSpec() : null;
        const rSpec = getRowSpecByKey(state.bench.selectedRowKey);

        const baseTarget = isStatic && sSpec
          ? {
              row: Number(sSpec.row) || 0,
              col: Number(sSpec.col) || 0,
              scope: sSpec.scope || 'cell',
              rowCode: sSpec.rowCode || undefined,
            }
          : {
              row: rSpec.row,
              col: state.bench.selectedCol,
              scope: state.bench.scope,
              rowCode: rSpec.code,
              colStart: getRowColStart(rSpec),
              activeCols: getRowActiveCols(rSpec),
            };

        const res = await api('/api/packs/edit-frame', {
          method: 'POST',
          body: JSON.stringify({
            packId: state.bench.packId,
            variantId: state.bench.variantId,
            ...baseTarget,
            ...payload,
          }),
        });
        if (Array.isArray(res.packs)) state.packs = res.packs;
        if (res.activePack) state.activePack = res.activePack;
        renderPacks();
        await loadBenchCharacter(state.bench.packId, state.bench.variantId, { keepSelection: true });
        showBenchToast(successMsg || '已应用修改', 'ok');
      } catch (err) {
        showBenchToast(err, 'err');
      } finally {
        state.bench.busy = false;
        updateBenchTargetControls();
      }
    }

    async function runBenchBatchTransform(transformPayload, actionLabel) {
      const cells = state.bench.batchCells.slice();
      if (cells.length === 0) {
        showBenchToast('请先点击选择要批量处理的动作帧。', 'err');
        return;
      }
      state.bench.busy = true;
      updateBenchTargetControls();
      showBenchToast('');
      try {
        let lastRes = null;
        for (const item of cells) {
          lastRes = await api('/api/packs/edit-frame', {
            method: 'POST',
            body: JSON.stringify({
              packId: state.bench.packId,
              variantId: state.bench.variantId,
              row: item.row,
              col: item.col,
              rowCode: item.code,
              scope: 'cell',
              action: 'transform',
              ...transformPayload,
            }),
          });
        }
        if (lastRes) {
          if (Array.isArray(lastRes.packs)) state.packs = lastRes.packs;
          if (lastRes.activePack) state.activePack = lastRes.activePack;
          renderPacks();
        }
        await loadBenchCharacter(state.bench.packId, state.bench.variantId, { keepSelection: true });
        showBenchToast(`已批量${actionLabel} ${cells.length} 帧`, 'ok');
      } catch (err) {
        showBenchToast(err, 'err');
      } finally {
        state.bench.busy = false;
        updateBenchTargetControls();
      }
    }

    function connectWs() {
      try {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${proto}//${location.host}`);
        ws.addEventListener('message', (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            if (msg?.type === 'state:sync' && msg.payload) {
              syncFromPayload(msg.payload);
            }
          } catch {}
        });
        ws.addEventListener('close', () => {
          setTimeout(connectWs, 3000);
        });
      } catch {}
    }

    (function syncTopbarStickyOffset() {
      const topbar = document.querySelector('.topbar');
      if (!topbar) return;
      const update = () => {
        const h = Math.max(52, Math.round(topbar.getBoundingClientRect().height || 52));
        document.documentElement.style.setProperty('--topbar-h', `${h}px`);
      };
      update();
      if (typeof ResizeObserver === 'function') {
        const ro = new ResizeObserver(update);
        ro.observe(topbar);
      } else {
        window.addEventListener('resize', update);
      }
    })();

    applyWorkshopTabUI();
    renderSmartImport();
    renderFacetedUpload();
    refreshState();
    connectWs();
  </script>
</body>
</html>
